# ============================================================
# PicoAide 服务端 Docker Compose 部署 —— PostgreSQL 外部实例模式
# ============================================================
# 完整可独立运行的 compose:包含 caddy + server 两个服务,server 直连
# 外部已存在的 PostgreSQL 实例(如企业统一数据库),不内置 postgres 容器。
# 不需要叠加 docker-compose.yml(与 pg 模式同构,仅数据库后端不同——一个内置
# postgres 容器、一个连外部实例,均为完整独立 compose 文件)。
#
# 用途:DB_MODE=pg-external 时使用(部署脚本 install/deploy 生成、或手动):
#   cp .env.example .env 并填写 DOMAIN / PICOAI_ADMIN_PASSWORD(必改)
#   cp Caddyfile.<模式> Caddyfile   # autocert=自动证书 / manual=手动证书
#   docker compose -f docker-compose.pg-ext.yml up -d
#
# 服务与固定 IP:
#   - caddy(172.28.0.2,CADDY_IP):HTTPS 反代,唯一对外入口
#   - server(172.28.0.3,SERVER_IP):PicoAide 服务端,仅内网可达,连外部 PG
#
# 环境变量(见 .env):
#   DOMAIN  PICOAI_ADMIN_PASSWORD  ADMIN_USER  TLS_MODE  SERVER_IMAGE
#   DB_MODE=pg-external  PG_DSN(必填,如
#     postgres://picoaide:secret@pg.example.com:5432/picoaide?sslmode=disable)
#   NETWORK_SUBNET  CADDY_IP  SERVER_IP  TZ
#
# 注意:
#   - 本文件是完整 compose,可单独使用(不再依赖主 docker-compose.yml)
#   - 外部库需服务端可网络可达,且该账号有建表权限(首次启动自动迁移 schema)
#   - 数据备份由外部 PG 的运维策略负责(本部署不接管 pg-data)
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: picoaide-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    # 手动证书模式需要挂载 certs/ 目录(auto 模式无 certs/ 时挂载空目录无害)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks:
      picoaide-net:
        ipv4_address: ${CADDY_IP:-172.28.0.2}
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  server:
    image: ${SERVER_IMAGE:-ghcr.io/picoaide/picoaide-harness-server:latest}
    container_name: picoaide-server
    restart: unless-stopped
    # 仅内网可达(经 Caddy),不发布宿主机端口
    expose:
      - "8080"
    environment:
      # 初始管理员密码(已有 admin 时 EnsureBootstrapAdmin 幂等跳过,可置空以清除明文凭据)
      # ⚠ 首次启动必填,部署前改为强密码;可用部署脚本随机生成
      PICOAI_ADMIN_PASSWORD: ${PICOAI_ADMIN_PASSWORD:-}
      # 主密钥:留空则由服务端首次启动自动生成于 data/master.key(请备份)
      PICOAI_MASTER_KEY: ${PICOAI_MASTER_KEY:-}
      # 可信反向代理(审计 2026-08-25 F-02):Caddy 固定 IP 默认 172.28.0.2,
      # 使登录限流键从 X-Forwarded-For 解析真实客户端 IP,防账号级 DoS
      PICOAI_TRUSTED_PROXIES: ${PICOAI_TRUSTED_PROXIES:-172.28.0.2}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./picoaide-data:/data
    # pg-external 模式:command 为外部 PostgreSQL 后端启动参数(compose 对 command
    # 是整组替换,必须写全——含 bootstrap-admin)
    command: ["--bootstrap-admin", "${ADMIN_USER:-admin}", "-db-driver", "pg", "-pg-dsn", "${PG_DSN:?PG_DSN must be set in .env}"]
    networks:
      picoaide-net:
        ipv4_address: ${SERVER_IP:-172.28.0.3}
    healthcheck:
      # /healthz 无需认证返回 200;wget 退出码 0=healthy(连接失败/非200=unhealthy)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  picoaide-net:
    name: picoaide-net
    driver: bridge
    ipam:
      config:
        # 只指定子网;gateway 由 docker 自动取子网第一个可用 IP,避免手工不一致
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/24}
