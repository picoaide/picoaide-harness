# ============================================================
# PicoAide 服务端 Docker Compose 部署 —— PostgreSQL 内置容器模式(PG-only 2026-08)
# ============================================================
# 完整可独立运行的 compose:包含 caddy + server + postgres 三个服务。
# 这是默认部署文件(原 sqlite 模式已下线;PG-only)。
#
# 用途:DB_MODE=pg(默认)时使用(部署脚本 install/deploy 生成、或手动):
#   cp .env.example .env 并填写 DOMAIN / PICOAI_ADMIN_PASSWORD(必改)
#   cp Caddyfile.<模式> Caddyfile   # autocert=自动证书 / manual=手动证书
#   docker compose -f docker-compose.pg.yml up -d
#   docker compose -f docker-compose.pg.yml down   # 停止
#   docker compose -f docker-compose.pg.yml logs -f
#
# 服务与固定 IP:
#   - caddy(172.28.0.2,CADDDY_IP):HTTPS 反代,唯一对外入口
#   - server(172.28.0.3,SERVER_IP):PicoAide 服务端,仅内网可达
#   - postgres(172.28.0.4,PG_IP):内置 PostgreSQL 18,数据落 ./pg-data
#
# 环境变量(见 .env,deploy.sh 自动生成):
#   DOMAIN  PICOAI_ADMIN_PASSWORD  ADMIN_USER  TLS_MODE  SERVER_IMAGE
#   DB_MODE=pg  PG_PASSWORD  PG_DSN  PG_IMAGE  PG_IP
#   NETWORK_SUBNET  CADDY_IP  SERVER_IP  TZ
#
# 注意:
#   - 本文件是完整 compose,可单独使用(不再依赖主 docker-compose.yml)
#   - postgres 不发布宿主机端口,仅内网(picoaide-net)可达
#   - 数据目录 ./pg-data(bind mount,冷备=停服拷贝目录);勿手工 chown
#     (postgres 官方镜像 entrypoint 自动处理目录所有权)
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: picoaide-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    # 手动证书模式需要挂载 certs/ 目录(auto 模式无 certs/ 时挂载空目录无害)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks:
      picoaide-net:
        ipv4_address: ${CADDY_IP:-172.28.0.2}
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  server:
    image: ${SERVER_IMAGE:-ghcr.io/picoaide/picoaide-harness-server:latest}
    container_name: picoaide-server
    restart: unless-stopped
    # 仅内网可达(经 Caddy),不发布宿主机端口
    expose:
      - "8080"
    environment:
      # 初始管理员密码(已有 admin 时 EnsureBootstrapAdmin 幂等跳过,可置空以清除明文凭据)
      # ⚠ 首次启动必填,部署前改为强密码;可用部署脚本随机生成
      PICOAI_ADMIN_PASSWORD: ${PICOAI_ADMIN_PASSWORD:-}
      # 主密钥:留空则由服务端首次启动自动生成于 data/master.key(请备份)
      PICOAI_MASTER_KEY: ${PICOAI_MASTER_KEY:-}
      # 可信反向代理(审计 2026-08-25 F-02):Caddy 固定 IP 默认 172.28.0.2,
      # 使登录限流键从 X-Forwarded-For 解析真实客户端 IP,防账号级 DoS
      PICOAI_TRUSTED_PROXIES: ${PICOAI_TRUSTED_PROXIES:-172.28.0.2}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./picoaide-data:/data
    # pg 模式:command 为 PostgreSQL 后端启动参数(compose 对 command 是整组替换,
    # 必须写全——含 bootstrap-admin;更短的写法见 deploy.sh 生成的 .env)
    command: ["--bootstrap-admin", "${ADMIN_USER:-admin}", "-db-driver", "pg", "-pg-dsn", "${PG_DSN:?PG_DSN must be set in .env}"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      picoaide-net:
        ipv4_address: ${SERVER_IP:-172.28.0.3}
    healthcheck:
      # /healthz 无需认证返回 200;wget 退出码 0=healthy(连接失败/非200=unhealthy)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: ${PG_IMAGE:-postgres:18-alpine}
    container_name: picoaide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: picoaide
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: picoaide
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    networks:
      picoaide-net:
        ipv4_address: ${PG_IP:-172.28.0.4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picoaide -d picoaide"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  picoaide-net:
    name: picoaide-net
    driver: bridge
    ipam:
      config:
        # 只指定子网;gateway 由 docker 自动取子网第一个可用 IP,避免手工不一致
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/24}
