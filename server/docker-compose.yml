# ============================================================
# PicoAide Harness 服务端 Docker Compose 部署(单文件)
# ============================================================
# 本文件是完整 compose:caddy(反代+TLS) + server(PicoAide 服务端)
# + postgres(内置 PostgreSQL 18),一个文件直接部署:
#
#   cp .env.example .env && docker compose up -d
#
# .env 必填(其余均有默认值,见下方变量说明):
#   PICOAI_ADMIN_PASSWORD  首启超管密码(已有 admin 后幂等跳过,可置空清除明文)
#   PG_PASSWORD            内置 postgres 容器密码
#   DOMAIN                 对外域名或 IP(默认示例值,生产必改)
#
# 证书模式(由 .env 的 TLS_MODE 决定挂载哪个 Caddyfile 模板):
#   manual   → Caddyfile.manual   (自签占位/企业 CA;支持 IP)
#   auto     → Caddyfile.autocert (Let's Encrypt 自动;需公网域名直连)
#   internal → Caddyfile.internal (Caddy 本地 CA;纯内网开箱即用)
# 2026-09-10 修复:此前 compose 拼接的是 ./Caddyfile.internal,而仓库里 internal
# 模式的模板文件名是 Caddyfile —— TLS_MODE=internal 从未真正可用(挂载源不存在,
# caddy 容器创建即失败)。三种模式现统一为 Caddyfile.<mode> 命名。
#
# 服务与固定 IP(容器重建后不变):
#   caddy(172.28.0.2)  唯一对外入口,HTTPS 反代 + TLS 终结
#   server(172.28.0.3) PicoAide 服务端,仅 expose 8080 内网可达
#   postgres(172.28.0.4) 内置 PostgreSQL 18,不发布宿主机端口
#
# 数据目录(全部 ./ 当前目录 bind mount,升级不丢):
#   ./picoaide-data  master.key + 应用数据(0700)
#   ./pg-data        PostgreSQL 数据(PG18 起容器内落 18/docker/ 子目录)
#   ./caddy-data     Caddy 自动证书库(auto 模式)
#   ./caddy-config   Caddy 配置
#   ./certs          手动证书(manual 模式,certs/server.crt + server.key)
# ============================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: picoaide-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    # 按 TLS_MODE 选择 Caddyfile 模板(默认 manual);域名用 {$DOMAIN} 在
    # Caddyfile 内插值,模板内无需写死域名
    volumes:
      - ./Caddyfile.${TLS_MODE:-manual}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-picoaide.example.com}
    networks:
      picoaide-net:
        ipv4_address: ${CADDY_IP:-172.28.0.2}
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  server:
    image: ${SERVER_IMAGE:-picoaide-harness-server:latest}
    container_name: picoaide-server
    restart: unless-stopped
    # 仅内网可达(经 Caddy),不发布宿主机端口
    expose:
      - "8080"
    environment:
      # 初始管理员密码(已有 admin 时 EnsureBootstrapAdmin 幂等跳过,可置空以清除明文凭据)
      # ⚠ 首次启动必填,部署前改为强密码;可用部署脚本随机生成
      PICOAI_ADMIN_PASSWORD: ${PICOAI_ADMIN_PASSWORD:-}
      # 主密钥:留空则由服务端首次启动自动生成于 data/master.key(请备份)
      PICOAI_MASTER_KEY: ${PICOAI_MASTER_KEY:-}
      # 本部署所属渠道(beta / official / 品牌渠道 id)。
      #
      # **默认不设置**(`:-` 后面为空):渠道由**镜像自带的**声明决定
      # (Dockerfile 的 ARG CHANNEL → ENV PICOAI_CHANNEL + /opt/picoaide/CHANNEL)。
      # 这里若写死 `:-official`,就会覆盖镜像里的渠道 —— 渠道化镜像会被当成
      # 官方部署,进而接受官方清单把自己的品牌洗掉(最严重的一类错)。
      # 只有确实要覆盖镜像声明时才在 .env 里显式设置,且服务端会校验它与
      # 镜像内的渠道内容一致,不一致直接拒绝启动。
      PICOAI_CHANNEL: ${PICOAI_CHANNEL:-}
      # 更新清单地址。**留空 = 用本渠道的默认目录**
      # (release.picoaide.com/<channel>/latest.json),不是"关闭检查"。
      # 要关闭更新检查请显式写 off / none / - / disabled。
      PICOAI_UPDATE_ENDPOINT: ${PICOAI_UPDATE_ENDPOINT:-}
      # 可信反向代理(审计 2026-08-25 F-02):Caddy 固定 IP 默认 172.28.0.2,
      # 使登录限流键从 X-Forwarded-For 解析真实客户端 IP,防账号级 DoS。
      # 宿主机已有别的反代(共享 Caddy/nginx)时,改成它连过来的地址(通常是
      # docker 网桥网关,如 172.20.0.1)。
      PICOAI_TRUSTED_PROXIES: ${PICOAI_TRUSTED_PROXIES:-172.28.0.2}
      # 本服务端对外可达地址(如 https://ai.example.com)。**配了就是唯一权威**;
      # 留空则按请求推导(X-Forwarded-Proto: https → TLS → 回环 http)。
      # 为什么要配:客户端更新清单里的下载地址必须是**绝对 https**,而客户端会
      # 丢弃非 https 的整份清单。若前面挂的是不设 X-Forwarded-Proto 的反代,
      # 或服务端在反代后面判断不出协议,清单会按设计拒发 client 段
      # (`client_unavailable`),表现为"检查更新永远说已是最新"。
      PICOAI_PUBLIC_BASE_URL: ${PICOAI_PUBLIC_BASE_URL:-}
      # ---- WASM 应用平台（员工自建应用）----
      # 应用访问模型（2026-09-19 起）：应用只在桌面客户端内打开 —— 客户端**应用窗口**
      # 加载自定义协议地址 <渠道 app 源 scheme>://<app_id>/（scheme 随渠道配置），由客户端转发到服务端唯一入口
      # POST /api/client/v2/apps/wasm/:app_id/request 执行。
      # 因此本栈**不需要**为应用准备任何公网入口：无额外域名解析、无额外证书、
      # 无需在 Caddy 里加站点块。升级必须服务端与客户端同版本（旧客户端打不开应用）。
      # 部署期注入的保留名（逗号分隔）：应用 id 不得占用这些名字。
      PICOAI_APPS_EXTRA_RESERVED: ${PICOAI_APPS_EXTRA_RESERVED:-}
      # 编译子进程隔离档：require（生产推荐）| auto（默认）| off（仅测试）。
      PICOAI_COMPILE_ISOLATION: ${PICOAI_COMPILE_ISOLATION:-auto}
      # WASM 应用平台**内存档位**：default（32 实例 / 128 MiB 模块缓存，理论峰值 ≈2.7 GiB）
      # | small（3 实例 / 64 MiB，≈630 MiB）| large（64 实例 / 256 MiB）。
      #
      # ⚠️ **可用内存小于约 4 GiB 的机器必须显式选 small**：启动自检会拿"档位折算的理论
      # 峰值"与本机 MemAvailable 的 70% 比，超了就**拒绝启动**（fail-closed，日志
      # `WASM 应用平台启动自检失败：…超过可用内存的安全水位，拒绝启动`）—— 2026-09-20
      # 生产环境（3.9 GiB）与客户测试环境各撞过一次，表现为容器反复重启。
      # 档位同时决定并发实例数、单实例内存上限与模块缓存上限；运行期还可在管理端
      # 「运维 → 应用平台」微调（那组设置不改变档位本身）。
      PICOAI_WASM_MEMORY_PROFILE: ${PICOAI_WASM_MEMORY_PROFILE:-}
      # 内置技能资产目录（随镜像发布，服务端由 GET /api/client/v2/skills/builtin
      # 下发，客户端在能力中心按需安装）。**默认就是镜像里的位置，一般不用改**；
      # 要换成宿主机目录（现场排查/加技能）时同时解开下面的 bind mount：
      #   volumes: - ./skills:/opt/picoaide/skills:ro
      PICOAI_SKILL_SEED_DIR: ${PICOAI_SKILL_SEED_DIR:-/opt/picoaide/skills}
      # 单账号登录失败上限(留空 = 服务端默认)。**仅测试环境**建议调大,
      # 免得反复登录把管理员账号锁死。
      PICOAI_LOGIN_MAX_ATTEMPTS: ${PICOAI_LOGIN_MAX_ATTEMPTS:-}
      # 每用户 in-flight(并发)请求上限,缺省 32。**注意它不是"请求速率"限制**:
      # 速率上限是 settings 的 gateway.rate_limit(缺省 0 = 不限速)。
      # R16C-06(审计 2026-09-25,P2):这个旋钮此前**只有文档**(AI-DEPLOY §网关 /
      # server/docs/04-auth.md 都写"可调"),却不在本文件的 environment 映射里,
      # 也没有 env_file ⇒ 写进 .env 后静默不生效、零回显。现在按既有风格接线。
      PICOAI_GATEWAY_MAX_INFLIGHT_PER_USER: ${PICOAI_GATEWAY_MAX_INFLIGHT_PER_USER:-}
      # 数据库连接池上限(留空 = 服务端按实例数推导的默认;见 serverstore/db.go)。
      # 多实例部署/托管 PG 配额有限时下调。
      PICOAI_DB_MAX_OPEN_CONNS: ${PICOAI_DB_MAX_OPEN_CONNS:-}
      # 允许保存**非回环明文** ldap:// 认证配置(逃生阀,默认关闭=拒绝)。
      # 只有在目录服务确实不支持 LDAPS/StartTLS 时才置 1 —— bind 密码会明文过网。
      # (审计 2026-09-13 的安全加固默认值;文档:docs/AUDIT-2026-09-13-SERVER-SECURITY.md)
      PICOAI_LDAP_ALLOW_PLAINTEXT: ${PICOAI_LDAP_ALLOW_PLAINTEXT:-}
      # 遥测采集的每用户/每技能限流(留空 = 服务端默认 60/10/10)。
      # 客户端错误上报另有独立预算(第三项)。
      PICOAI_TELEMETRY_MAX_PER_MIN: ${PICOAI_TELEMETRY_MAX_PER_MIN:-}
      PICOAI_TELEMETRY_MAX_PER_SKILL_PER_MIN: ${PICOAI_TELEMETRY_MAX_PER_SKILL_PER_MIN:-}
      PICOAI_TELEMETRY_ERROR_REPORTING_MAX_PER_MIN: ${PICOAI_TELEMETRY_ERROR_REPORTING_MAX_PER_MIN:-}
      # OIDC 登录回跳时额外信任的服务端主机名(逗号分隔)。反代/多域名部署时补,
      # 留空 = 只用请求自身的主机名与已保存 issuer(见 serverauth/oidc.go)。
      PICOAI_TRUSTED_HOSTS: ${PICOAI_TRUSTED_HOSTS:-}
      # 审计哈希链周期校验的间隔(Go duration,如 15m;留空 = 1h)。
      # 它同时是"篡改可见性窗口"与"每轮一次 audit_logs 全表只读扫描"的取舍旋钮。
      # 非法值会打 WARNING 并回落默认,不静默。
      PICOAI_AUDIT_CHAIN_INTERVAL: ${PICOAI_AUDIT_CHAIN_INTERVAL:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./picoaide-data:/data
    # DSN 由 PG_PASSWORD 派生(compose 对 command 是整组替换,必须写全——
    # 含 bootstrap-admin);PG_PASSWORD 用 :? 强制必填,缺失时 compose 直接报错
    command: ["--bootstrap-admin", "${ADMIN_USER:-admin}", "-db-driver", "pg", "-pg-dsn", "postgres://picoaide:${PG_PASSWORD:?PG_PASSWORD must be set in .env}@postgres:5432/picoaide"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      picoaide-net:
        ipv4_address: ${SERVER_IP:-172.28.0.3}
    healthcheck:
      # /healthz 无需认证返回 200;wget 退出码 0=healthy(连接失败/非200=unhealthy)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: ${PG_IMAGE:-postgres:18-alpine}
    container_name: picoaide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: picoaide
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: picoaide
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # PG 18+ 官方镜像 PGDATA=/var/lib/postgresql/<major>/docker,
      # 挂载父目录 /var/lib/postgresql(容器内数据落 18/docker 子目录);
      # 旧挂载点 /var/lib/postgresql/data 会被 entrypoint 判定为
      # "unused mount/volume" 并拒绝启动(实测 exit 1)。
      - ./pg-data:/var/lib/postgresql
    networks:
      picoaide-net:
        ipv4_address: ${PG_IP:-172.28.0.4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picoaide -d picoaide"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  picoaide-net:
    name: picoaide-net
    driver: bridge
    ipam:
      config:
        # 只指定子网;gateway 由 docker 自动取子网第一个可用 IP,避免手工不一致
        - subnet: ${NETWORK_SUBNET:-172.28.0.0/24}
