# ============================================================
# PicoAide 服务端 PostgreSQL 后端(内置容器模式)override
# ============================================================
# 用途:DB_MODE=pg 时由 deploy.sh 通过 COMPOSE_FILE 叠加本文件:
#   docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d
# 效果:
#   - 新增 postgres 服务(固定 IP 172.28.0.4,数据落 ./pg-data)
#   - server 以 -db-driver pg -pg-dsn 启动,DB 由 postgres 容器提供
# 环境变量(见 .env ,deploy.sh 自动生成):
#   DB_MODE=pg  PG_PASSWORD  PG_DSN  PG_IMAGE  PG_IP
# 注意:
#   - 本文件只是 override,不能单独使用(需要主 compose 的 caddy/server/网络)
#   - postgres 不发布宿主机端口,仅内网(picoaide-net)可达
#   - 数据目录 ./pg-data(bind mount,冷备=停服拷贝目录);勿手工 chown
#     (postgres 官方镜像 entrypoint 自动处理目录所有权)
#   - 手动部署本模式: .env 配好 DB_MODE=pg + PG_PASSWORD 后
#     docker compose -f docker-compose.yml -f docker-compose.pg.yml up -d
# ============================================================

services:
  postgres:
    image: ${PG_IMAGE:-postgres:16-alpine}
    container_name: picoaide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: picoaide
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: picoaide
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    networks:
      picoaide-net:
        ipv4_address: ${PG_IP:-172.28.0.4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picoaide -d picoaide"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  server:
    # compose 对 command 是整组替换,必须写全(含主 compose 的 bootstrap-admin)
    command: ["--bootstrap-admin", "${ADMIN_USER:-admin}", "-db-driver", "pg", "-pg-dsn", "${PG_DSN:?PG_DSN must be set in .env}"]
    depends_on:
      postgres:
        condition: service_healthy
