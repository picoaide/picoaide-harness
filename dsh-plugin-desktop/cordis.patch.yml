# DSH Desktop is an ordinary dual-face Cordis plugin. The existing Web bundle
# still owns the browser carrier and client roster; this row adds the native
# shell and lets client-modules discover this package's ./client artifact.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: []
