# Compatibility mode adds only the native Host shell. The existing Web bundle
# keeps ownership of the browser carrier, client roster, and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: []
