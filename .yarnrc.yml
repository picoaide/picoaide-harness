enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# 注意:下面这段**不是**"macOS 通用包"的要求 —— 本仓的 macOS 交付件只有 arm64:
# packages/host/desktop/package.json 的 build.mac.arch 是 ["arm64"],release-mac.ts /
# package-mac.ts 全都传 --arm64,CI 的 mac job 也跑在 arm64 runner 上(门户文案同口径)。
# 保留 x64 的实际代价:每次 yarn install 都会为**当前 OS**多装一份另一 CPU 变体的可选
# 原生依赖(如 @img/sharp-linux-arm64),打包期再靠 build.linux.files 的排除清单把它们
# 剔掉 —— 那份清单本身就是"它们真会被装进来"的证据。
# 收窄成 `cpu: [current]` 属**构建面**改动(改变 install 解析与 node_modules 内容,打包
# 排除清单/闭包门禁都要重新验证),没有作为一次"注释改真值"的修复一并做。
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64

# Writable local cache: the default global cache (~/.yarn/berry) is
# read-only in this environment (CI/containers).
cacheFolder: ./.yarn/cache
enableGlobalCache: false
