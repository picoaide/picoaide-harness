name: GHCR cleanup (manual)

# 手动运维:列出 GHCR server 镜像全部版本,删除所有"预发布"镜像 tag
# (tag 含连字符,如 v2.6.7-beta.1;正式版标签为纯数字 vX.Y.Z 与 latest,绝不误删)。
# 包的权限来自关联仓库的 Actions token,与 docker.yml 推送同源(包级动作访问)。

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: List and delete prerelease image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/orgs/picoaide/packages/container/picoaide-harness-server/versions?per_page=100" \
            --jq '.[] | [.id, (.metadata.container.tags // [] | join(","))] | @tsv' > versions.tsv
          echo "== all versions =="
          cat versions.tsv
          echo "== deleting prerelease (tag contains '-') =="
          while IFS=$'\t' read -r id tags; do
            [ -z "$id" ] && continue
            case ",$tags," in
              *,*,)
                [ "$(echo "$tags" | tr ',' '\n' | grep -c -- '-')" -gt 0 ] || continue
                echo "deleting version $id ($tags)"
                gh api -X DELETE "/orgs/picoaide/packages/container/picoaide-harness-server/versions/$id"
                ;;
            esac
          done < versions.tsv
          echo "== remaining =="
          gh api "/orgs/picoaide/packages/container/picoaide-harness-server/versions?per_page=100" \
            --jq '.[] | (.metadata.container.tags // [] | join(","))'
