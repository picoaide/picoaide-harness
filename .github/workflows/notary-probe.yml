name: Ops · Notary probe

# 运维探针:手动触发,用 repo secrets 里的 App Store Connect API key 查询
# Apple 公证端全部历史 submission 状态(官方 xcrun notarytool history/log)。
# 用于诊断「提交后长时间 In Progress / 网络断连」到底是 Apple 侧问题
# (新团队首次公证排队、statusCode 7000 等)还是我方流程问题。
# 输出只含 submission id/status/日期与日志,不含凭据。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Materialize App Store Connect API key
        run: |
          # 显式声明退出语义(与 ci.yml 同一口径):块中间某条命令失败必须让 step 红。
          # 这里用 `set -eo pipefail` 而不是 `-u`:几个 APPLE_* 都来自可选 secrets,
          # nounset 会把"没配这个 secret"变成 shell 层报错,盖掉真正的失败原因。
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      - name: Submission history
        run: |
          # 同上:`|| echo` 已按 P3 去掉,这里补上显式 errexit,探针失败必须让 step 红。
          set -eo pipefail
          echo "== notarytool history =="
          # P3: 去掉 `|| echo` —— 探针失败必须让 step 红(GitHub bash 默认 -e)。
          xcrun notarytool history \
            --key "$RUNNER_TEMP/notary/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --output-format json
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Logs for known submissions
        run: |
          # 这个块**不加** errexit:它要"逐条查询、单条失败也继续跑完其余条",最后按
          # `failed` 计数统一 exit 1(加 -e 会让第一条失败就中断,后面的日志全丢)。
          # 汇总退出码的语义由块末尾的 `if [ "$failed" -ne 0 ]; then … exit 1; fi` 保证。
          #
          # P3: 逐个查询,失败不再 `|| echo` 静默吞掉 —— 记 ::error:: 并让 step 退出非零,
          # 但仍继续查询其余 submission(单条失败不掩盖其它条日志)。
          failed=0
          for ID in \
            2195f54c-fdac-4fd5-8999-065e92f04125 \
            b5cfdbed-230b-41bd-8d8a-9cc46e3e1cfb; do
            if [ -z "$ID" ]; then continue; fi
            echo "== notarytool log $ID =="
            if ! xcrun notarytool log "$ID" \
              --key "$RUNNER_TEMP/notary/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER"; then
              echo "::error::notarytool log $ID failed (maybe still processing)"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed submission log(s) failed"
            exit 1
          fi
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
