name: CodeQL

# 显式 CodeQL 工作流(替代 GitHub default setup):
# 引用 .github/codeql-config.yml —— 只扫产品 src, 排除构建产物/vendor/上游。
# 语言: Go + JavaScript/TypeScript + Python(仓库三个产品语言)。
# 说明: default setup 不支持 paths-ignore/config-file, 必须显式 workflow。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'  # 每周一 03:17 UTC, 兜底扫描

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      # 初始化 CodeQL(带 config-file, paths-ignore 在此生效)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml
      # Go 需要完整构建; JS/TS 和 Python 是 buildless
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
