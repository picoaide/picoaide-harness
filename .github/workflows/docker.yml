name: Publish server image

# 服务端镜像标签补全(2026-09-10 改版):
# 镜像由 **ci.yml 的 release job 唯一构建**(那里才同时有三平台客户端资产,
# 客户端随镜像分发),并推送 ghcr.io/picoaide/picoaide-harness-server:vX.Y.Z。
# 本 workflow 负责把该镜像补推成完整标签面:
#   - push tag v*:从 GHCR 取回 vX.Y.Z,补推 latest + vX.Y(正式版)
#     / 仅 vX.Y.Z(预发布版,不污染 latest)
#   - workflow_dispatch:从源码构建任意版本号(冷启动/手工补镜像时的逃生通道)
# 单平台 linux/amd64(2026-08-26 起移除 arm64——QEMU 模拟构建过慢且镜像体积
# 翻倍;如后续需要可加回并启用原生 ARM runner)。
#
# 为什么不在这里构建:客户端安装包只有 ci.yml 的 desktop-* artifact 拿得到,
# 两处各建一次会带来构建配置漂移(镜像内容不一致),且 tag 触发时白跑一遍。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v2.3.0 或 2.3.0)'
        required: true
        type: string

permissions:
  contents: read

# 同 ref 并发触发(重推 tag/手动 dispatch)互斥,避免争抢写入同一组标签
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/picoaide/picoaide-harness-server

jobs:
  build:
    name: Build and push amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # type=gha 缓存后端写 Actions 缓存需 actions: write;推送 GHCR 需 packages: write。
    # 顶层已收窄为 contents: read,此处按 job 最小扩权(与 ci.yml release job 同风格)。
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      # 审计惯例(同 ci.yml release job):ubuntu 镜像自带 node 版本非保证,
      # version.mjs 校验步骤需要确定性环境
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version
        id: version
        # 手动 dispatch 输入不经 shell 拼接(注入防护:经 env 传入,官方推荐模式)
        env:
          REF_INPUT: ${{ github.event.inputs.version }}
          REF_PUSH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            REF="$REF_PUSH"
          else
            REF="$REF_INPUT"
          fi
          V="${REF#v}"
          # 严格白名单(可含预发布如 2.3.0-rc.1):空 / 含白名单外字符(;, $, 引号,
          # 空白, 换行等, 防 tag 名/手动输入注入 shell 与 GITHUB_OUTPUT) / 非数字开头
          case "$V" in
            ''|*[!0-9A-Za-z.-]*|[!0-9]*)
              echo "::error::无效版本号: $REF(示例: v2.3.0 或 2.3.0)"; exit 1 ;;
          esac
          # semver 形状:主.次(.修订)(-预发布[, . 分段]),拒绝 '2.x' 之类
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号形状非法: $REF(期望 semver 如 v2.3.0 或 v2.3.0-rc.1)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$V" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      # 同一 tag 上,GitHub Release(ci.yml)校验 tag==package.json;Docker 镜像
      # 也应保持同源,否则会出现"镜像里注入 2.3.0 而产品版本 2.3.1"的漂移。
      # 注:PR/非 tag 分支上 package.json 可能先改版本后打 tag(开发常态),
      # 因此仅 push tag 时强制校验;workflow_dispatch 输入不强制(可构建任意版本)。
      - name: Verify tag matches product version
        if: github.event_name == 'push'
        shell: bash
        run: |
          node scripts/version.mjs check "$REF_PUSH"
        env:
          REF_PUSH: ${{ github.ref_name }}

      - name: Compose image tags
        id: tags
        env:
          IMAGE_NAME: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
        shell: bash
        run: |
          IMAGE="$IMAGE_NAME"
          V="$VERSION"
          MM="$MAJOR_MINOR"
          if [[ "$V" == *-* ]]; then
            # 测试版(prerelease 段,如 2.7.0-rc.1):仅推具体版本 tag,不打
            # latest / 主版本宽 tag —— 测试镜像不得污染生产拉取面(显式引
            # 版本不受影响,latest 与 v2.7 留给正式版)。
            TAGS="${IMAGE}:v${V}"
            echo "Prerelease version: tagging ${TAGS} only"
          else
            # 相邻去重(如手动填 '2.3' 时 v$V == v$MM),避免重复 tag 令 build 报错
            TAGS="$(for T in latest "v$V" "v$MM"; do echo "${IMAGE}:$T"; done | uniq | paste -sd, -)"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Composed tags: $TAGS"

      # tag 触发:镜像已由 ci.yml 的 release job 构建并推送,这里只需取回、
      # 按本 workflow 的标签规则重新打标,不再从源码重建(避免两处构建漂移)。
      - name: Adopt the release-built image from GHCR
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SRC="${IMAGE_NAME}:v${VERSION}"
          # 同一个 tag 会并发触发 ci.yml(构建并推送该镜像)与本 workflow:
          # 本步骤可能先于对方推完就开跑。轮询等待最多 10 分钟(30×20s),
          # 全部重试都失败再报错 —— 不静默跳过,否则 latest 永远不更新。
          ok=0
          for i in $(seq 1 30); do
            if docker pull --platform linux/amd64 "$SRC" >/dev/null 2>&1; then ok=1; break; fi
            echo "等待 ci.yml release job 推送 $SRC ... (${i}/30)"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$SRC 在 10 分钟内未出现 —— ci.yml 的 release job 是否失败或未触发?"
            exit 1
          fi
          # TAGS 是逗号分隔的目标标签列表(Compose image tags 已按正式/预发布算好)
          IFS=',' read -ra LIST <<< "$TAGS"
          for t in "${LIST[@]}"; do docker tag "$SRC" "$t"; done
          echo "已取回 $SRC 并打标: $TAGS"

      # tag 触发:推本 workflow 的完整标签面(latest + vX.Y / 预发布仅 vX.Y.Z)。
      # 镜像内容与 ci.yml release job 构建的 vX.Y.Z 完全一致(同一个镜像 ID 重新打标)。
      - name: Push retagged image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra LIST <<< "$TAGS"
          for t in "${LIST[@]}"; do
            docker push "$t"
            echo "pushed $t"
          done

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成 OCI 元数据标签(org.opencontainers.image.source 指向本仓库),GHCR
      # 据此把包关联到本仓库——首次推送即自动关联并授予本仓库 Actions 写入
      # 权限。此前镜像无 source label、且包已被 picoaide-next 关联,导致
      # write_package 被拒的 bootstrap 死锁。tags 由上方 Compose image tags
      # 步骤负责,此处仅产出 labels(flavor 关闭默认 tag 生成,避免与手工
      # tags 冲突;labels 输出不依赖 tags 配置)。
      - name: Extract metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            prefix=
            suffix=

      # 仅 workflow_dispatch(手工补镜像/冷启动)从源码构建;tag 触发走上面的取回路径
      - name: Build and push (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          # context=server:server/.dockerignore 生效,Dockerfile 内相对路径不变;
          # 命名上下文 root=. 提供仓库根 brands/official(webadmin 编译期品牌源,
          # Dockerfile stage1 用 --from=root 注入,保持 brands 唯一权威不入镜像构建目录)。
          context: server
          platforms: linux/amd64
          build-contexts: |
            root=.
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
          sbom: true
          provenance: mode=max

      - name: Verify image runs (version injection + healthz)
        env:
          IMAGE_NAME: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          IMAGE="$IMAGE_NAME"
          TAG="v$VERSION"
          VERSION_WANTED="$VERSION"
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE:$TAG" >/dev/null
          # 版本注入校验:--version 精确等于注入版本(非 dev)
          VERSION_OUT="$(docker run --rm --platform linux/amd64 \
            --entrypoint /app/picoaide-server "$IMAGE:$TAG" --version)"
          if [ "$VERSION_OUT" != "$VERSION_WANTED" ]; then
            echo "::error::版本注入失败: 镜像输出 '$VERSION_OUT',期望 '$VERSION_WANTED'"
            exit 1
          fi
          echo "version injection OK: $VERSION_OUT"
          # 健康端点:真实启动一次,等 /healthz 返回 200(${ok:true} 无认证)。
          # 注意:服务端 PG-only,/healthz 会 ping DB——必须同时起一个 postgres
          # 容器并传 -pg-dsn,否则 503 导致 30s 校验失败(2026-08 修复:此前
          # v2.4.1+ 每次 Docker 发版均因此失败)。
          NET="picoaide-verify-$$"
          docker network create "$NET" >/dev/null
          PG_CID="$(docker run -d --network "$NET" --name picoaide-verify-pg \
            -e POSTGRES_USER=picoaide -e POSTGRES_PASSWORD=verify -e POSTGRES_DB=picoaide \
            postgres:18-alpine)"
          CID=""
          trap 'docker rm -f "$CID" "$PG_CID" >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true' EXIT
          # 等 PG 就绪(最多 30s):pg_isready 通过后仍可能处于
          # "database system is starting up" 短暂窗口(2026-09-05 beta 实测
          # 服务端撞上 SQLSTATE 57P03),用 psql SELECT 1 的真连接级检查,
          # 配合服务端 30s 启动重试(serverstore.openPG)双保险。
          for i in $(seq 1 30); do
            if docker exec "$PG_CID" pg_isready -U picoaide -d picoaide >/dev/null 2>&1 \
              && docker exec "$PG_CID" psql -U picoaide -d picoaide -c 'SELECT 1' >/dev/null 2>&1; then
              echo "postgres ready (${i}s)"
              break
            fi
            sleep 1
          done
          CID="$(docker run -d --network "$NET" -p 127.0.0.1:18080:8080 "$IMAGE:$TAG" \
            -db-driver pg \
            -pg-dsn 'postgres://picoaide:verify@picoaide-verify-pg:5432/picoaide?sslmode=disable')"
          # 冷启动要跑全部迁移(50+ 条)并建 usage 分区,受限 runner 上 30s 偏紧
          # (2026-09-01 v2.5.11 因此假失败);放宽到 120s,并在失败时打印容器
          # 日志——此前失败只有一行超时,零诊断信息。
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              echo "healthz OK (${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz 未在 120s 内就绪"
          echo "----- server logs -----"
          docker logs "$CID" 2>&1 | tail -50
          echo "----- postgres logs -----"
          docker logs "$PG_CID" 2>&1 | tail -20
          exit 1

      - name: Verify image manifest (amd64)
        env:
          IMAGE_NAME: ${{ env.IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          IMAGE="$IMAGE_NAME"
          TAG="v$VERSION"
          # 单平台镜像:inspect 输出应含 "Platform: linux/amd64"(+ attestation
          # manifest 的 unknown/unknown),精确匹配行尾断言 amd64 存在且为唯一
          # 平台镜像(不再有 arm64)。
          MANIFEST="$(docker buildx imagetools inspect "$IMAGE:$TAG")"
          echo "$MANIFEST"
          if ! echo "$MANIFEST" | grep -Eq "Platform: +linux/amd64\$"; then
            echo "::error::manifest 缺少 linux/amd64"
            exit 1
          fi
          if echo "$MANIFEST" | grep -Eq "Platform: +linux/arm64\$"; then
            echo "::error::manifest 不应包含 linux/arm64(已移除 arm64)"
            exit 1
          fi
          echo "single-arch manifest OK (linux/amd64)"
