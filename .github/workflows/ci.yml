name: CI

on:
  pull_request:
  push:

# 审计 2026-08-25 D-3:顶层权限收窄为 contents: read(actions: write 对纯 CI
# 仓库非最小)。release job 在自身声明 contents: write。
permissions:
  contents: read

# 审计 2026-08-25 D-2:同 ref 并发触发(重推 tag/两 tag)互斥,release 不再
# 并行争抢同一版本。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    # 2026-09-02:CI 不再提供 PostgreSQL 服务——构建/编译/单元测试不依赖数据库;
    # DB 相关测试在无 PG 环境下自动 Skip(serverstore.NewTestDB 探测),有 PG
    # 的环境(本地 PG_DSN_TEST)仍可跑全量。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make build-server
      - name: Deploy script syntax checks
        # defaults.run.working-directory 已是 server/,此处路径不用 server/ 前缀,
        # 否则实际变为 server/server/scripts/...(文件不存在, exit 127)。
        run: |
          bash -n scripts/install-server.sh scripts/deploy.sh
          if command -v docker >/dev/null 2>&1; then
            # 单 compose 文件(caddy+server+postgres):PG_PASSWORD 强必填,
            # 注入后验证语法
            PG_PASSWORD=ci docker compose -f docker-compose.yml config -q
            # 2026-09-02:PG18 挂载点运行验证需要启动 postgres 容器——CI 默认
            # 不依赖数据库,该检查改为 RUN_PG18_MOUNT_CHECK=1 时显式启用
            # (发布/部署验证流水线可设置)。compose 语法校验(上一步)仍始终执行。
            if [ "${RUN_PG18_MOUNT_CHECK:-0}" = "1" ]; then
              # 审计 2026-08-31:PG18 挂载点兼容验证——postgres:18-alpine 的 PGDATA
              # 是 /var/lib/postgresql/18/docker,compose 挂载 ./pg-data:/var/lib/postgresql
              # (父目录)。旧挂载点 /var/lib/postgresql/data 会被 entrypoint 判定为
              # "unused mount/volume" 而拒绝启动(exit 1),导致部署失败。
              # 2026-08-31 修复:临时目录改用 $RUNNER_TEMP(runner 保证可写且宿主可
              # 清理),不再依赖 /tmp;PG 容器以非 root(postgres uid 999)启动,而
              # mktemp -d 创建的目录是 0700 宿主权限——postgres 无法在挂载点内创建
              # 18/ 子目录,容器立即退出(No such container)。挂载点必须放开写权限。
              PG18_MOUNT="$(mktemp -d -p "${RUNNER_TEMP:-/tmp}")"
              chmod 0777 "$PG18_MOUNT"
              if ! PG18_CID="$(docker run -d --rm --name picoaide-ci-pg18 \
                -e POSTGRES_USER=picoaide -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=picoaide \
                -v "$PG18_MOUNT:/var/lib/postgresql" postgres:18-alpine)"; then
                echo "::error::docker run postgres:18-alpine 启动失败(详见上方 docker 输出)"
                rm -rf "$PG18_MOUNT"
                exit 1
              fi
              sleep 8
              if ! docker ps --format '{{.Names}}' | grep -qx picoaide-ci-pg18; then
                echo "::error::postgres:18-alpine 未能在挂载 /var/lib/postgresql 下启动(请检查 compose 挂载点)"
                docker logs "$PG18_CID" 2>&1 | tail -20 || true
                docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
                rm -rf "$PG18_MOUNT" 2>/dev/null || true
                exit 1
              fi
              docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
              rm -rf "$PG18_MOUNT" 2>/dev/null || true
              echo "postgres:18-alpine mount-point check OK"
            else
              echo "PG18 挂载点运行验证跳过(RUN_PG18_MOUNT_CHECK=1 启用)"
            fi
          else
            # 审计 2026-08-25 A-01:docker 缺失时显式失败(此前静默跳过 =
            # compose 语法零验证)。
            echo "::error::docker 不可用,compose 语法校验被跳过"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (linux)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn workspace dsh-plugin-desktop dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Linux
          path: |
            packages/host/desktop/dist/*.AppImage
            packages/host/desktop/dist/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (windows)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Windows-installer
          path: packages/host/desktop/dist/*Setup*.exe
          if-no-files-found: error

  desktop-macos:
    name: Desktop (macOS)
    # 未签名冒烟在 PR/分支/测试版 tag 上跑:rc(带 prerelease 段)不签名不公证
    # (内部测试用,右键打开即可),只有正式 tag 走 desktop-macos-release
    # (签名+公证,用户安装体验)。避免 mac runner(10 倍计费)+Apple 公证队列
    # 成为测试迭代瓶颈(2026-09-05 定案)。
    if: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (macos)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  # 签名+公证的正式 mac 发布：tag 推送触发,凭据全走 repo secrets。
  # 凭证仅在 electron-builder 子进程可见(yarn check 等其余步骤经
  # release-mac.ts 的 withoutMacReleaseSecrets 剥离),不会进入构建检查环境。
  # dist:mac 预检 fail-loud:任一 secret 缺失/格式非法立即失败,绝不产出
  # 未签/未公证的 DMG 作为发布资产。
  desktop-macos-release:
    name: Desktop (macOS signed release)
    # 仅正式 tag(纯 vX.Y.Z)签名+公证;测试版 tag(vX.Y.Z-*)不在此列
    # (走 desktop-macos 未签名冒烟,rc 不进苹果签名公证)。
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    # arm64 原生 runner(macos-15 = Apple Silicon):产物已是 arm64-only
    # (见 b32165bd25),原生架构上 electron 与原生依赖全部 arm64 原生下载/
    # rebuild,无需在 Intel 上交叉打包。早期 macos-latest 上 notarytool
    # submit --wait 公证轮询曾随机断连(NSURLError -1009/-1005,
    # electron/notarize#219 同款),由下方 3x 整步重试 + 240 分钟窗口兜底
    # (2026-09-05 起 macos-15-intel 首测作为对照;arm64 若复现断连再评估)。
    runs-on: macos-15
    # 2026-09-05:完整 gate(check)+arm64 打包+公证轮询实测 56~88 分钟,
    # 且 Apple 公证队列可能更久(实测定例 >100 分钟仍在 In Progress);
    # 曾两次在 notarytool 轮询阶段被 timeout-minutes 杀掉(签名均已成功)。
    # 轮询窗口 240 分钟 + job 上限 330 分钟(GitHub 上限 360)兜底。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (macos)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      # App Store Connect API Key:secret 里存的是 .p8 文件内容,写入临时文件
      # 以路径形式传给 electron-builder(与 release-preflight 测试同构)。
      - name: Materialize App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # 2026-09-05 拆分:打包(含完整 gate)与公证解耦。electron-builder 内联
      # notarytool 在 runner 上会断连(已实证),因此:
      #  1) dist:mac:pack —— 一次通过 fail-loud(不再被公证重试连带重跑);
      #  2) dist:mac:notarize —— 公证+staple+DMG+验证,独立重试至多 3 次:每次
      #     断连只损失 bounded wait 调用,submission id 经输出目录的状态文件
      #     持久化,后续重试续等同一 submission(不会重新提交/重新排队)。
      - name: Pack and sign app bundle
        run: yarn workspace dsh-plugin-desktop dist:mac:pack
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # preflight 校验整体发布凭据完整性(含公证三元组),pack 不公证但需通过
          # 校验——不传会在"Pack"步骤提前 fail(2026-09-05 rc.3 实测)。
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Notarize and build DMG (resumable)
        run: |
          for attempt in 1 2 3; do
            echo "attempt ${attempt}/3: yarn dist:mac:notarize"
            if yarn workspace dsh-plugin-desktop dist:mac:notarize; then
              echo "notarized DMG built on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt ${attempt} failed; retrying in 60s (same submission resumed)"
              sleep 60
            fi
          done
          exit 1
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-release/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop-linux, desktop-windows, desktop-macos-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      # 审计 2026-08-25 复查【7】:release job 需要显式 node(ubuntu 镜像自带
      # 版本非保证),tag 校验的 node -p 才有确定性环境。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 审计 2026-08-25 D-2:发布前强制校验 tag == 两处 package.json version
      # (update-checker 剥 v 后匹配资产名;版本号只改一处 = 发布成功但用户
      # 升级源永久失效)。不一致直接 fail-loud。用 scripts/version.mjs 统一
      # 校验(git tag 权威源;set 子命令可一键同步两处)。
      - name: Verify tag matches package versions
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Compute SHA-256 digests
        run: |
          cd release-artifacts
          # 审计 D-4:显式清单防 glob 吞入残留产物;空目录时 xargs 报错,先保护。
          if ! find . -maxdepth 1 \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) | grep -q .; then
            echo "::error::no release artifacts found";
            exit 1
          fi
          # 修复 2026-08-25:旧版 sha256sum * 无 ./ 前缀,find|xargs 产出 ./ 前缀,
          # 而客户端 update-download 用裸文件名严格匹配 → v2.2.0 起 SHA256SUMS
          # 永远 checksum-missing(升级提示后下载静默失败)。%f\0 保留 D-4 显式清单
          # 健壮性,同时恢复裸文件名兼容全部客户端版本。
          find . -maxdepth 1 \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -printf '%f\0' \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 变更说明优先读取仓库内 docs/releases/<tag>.md(由发布者随版本提交,
      # 保持与 GitHub Release Body 一致),保证每个版本都有完整、可审阅的说明;
      # 文件缺失时降级为 GitHub 原生 --generate-notes(按版本区间提交自动生成),
      # 避免再次出现「版本发布但 Release 无变更说明」的占位文案。
      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FLAG="--notes-file docs/releases/${TAG}.md"
          if [ -f "docs/releases/${TAG}.md" ]; then
            echo "Using curated release notes from docs/releases/${TAG}.md"
          else
            echo "::warning::docs/releases/${TAG}.md not found — falling back to GitHub auto-generated notes"
            NOTES_FLAG="--generate-notes"
          fi
          # 测试版 tag(带 prerelease 段,如 v2.7.0-rc.1,version.mjs check 已保证
          # 是合法 semver,不含 + 元数据)以 Pre-release 发布:GitHub
          # releases/latest 端点与客户端 update-checker/update-download 都
          # 排除 prerelease,正式用户不会收到更新;资产完整签名公证,可手动
          # 下载验证。正式 tag(纯 vX.Y.Z)发布为普通 release,才推送给用户。
          PRERELEASE=""
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE="--prerelease"
            echo "Releasing ${TAG} as a prerelease (test build — stable clients will not see it)"
          fi
          gh release create "${TAG}" \
            --repo picoaide/picoaide-harness \
            --title "PicoAide Harness ${TAG}" \
            ${NOTES_FLAG} \
            ${PRERELEASE} \
            release-artifacts/*.AppImage release-artifacts/*.exe release-artifacts/*.dmg release-artifacts/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
