name: CI

on:
  pull_request:
  push:

# 审计 2026-08-25 D-3:顶层权限收窄为 contents: read(actions: write 对纯 CI
# 仓库非最小)。release job 在自身声明 contents: write;pr-summary 声明
# pull-requests: write;gate/平台 job 声明 actions: write(artifact 上传)。
permissions:
  contents: read

# 审计 2026-08-25 D-2:同 ref 并发触发(重推 tag/两 tag)互斥,release 不再
# 并行争抢同一版本。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

# ============================================================================
# 重设计(2026-09-06,见 docs/decisions/2026-09-06-ci-pipeline-redesign.md):
#   gate    = 平台无关门禁 + 全 workspace 一次构建(产物上传,喂三平台 job)。
#   server  = Go + webadmin 门禁 + server 二进制。
#   desktop-* = needs: gate,下载构建产物,只做平台专属打包/验证/E2E,
#              不再重复编译(打包脚本 --no-prebuild / --no-gates)。
#   每个 push/PR 提交都产出:三平台安装包 + server 二进制(Artifacts 可下载),
#   PR 由 pr-summary 评论指引;tag 走 mac 签名 + release job 发布。
# ============================================================================

jobs:
  gate:
    name: Gate (tests + workspace build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 顺序约束(2026-09-06 实测):setup-node@v7 默认 enable-corepack: false
      # 且会重排 PATH——corepack enable 必须在 setup-node 之后执行,否则
      # Windows 上 yarn shim 被覆盖,install 落到全局 Yarn 1.22(实测报错)。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn (and electron for the linux packaging job)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      # 根 check(2026-09-06 重排):desktop check 最前(一次构建产出桌面 lib/types,
      # 其余包 tsc 依赖),随后 better-sidebar 与其余包 check,全程每包只构建一次。
      - run: yarn check
      # 2026-09-06 实测:upload-artifact 对多 glob path 会按各条目的根拍平目录
      # 结构(下载后 lib/ 树丢失),故先 tar 打包为单文件,目录结构自控。
      - name: Package workspace build products
        run: |
          tar -czf workspace-build.tgz \
            packages/host/desktop/lib packages/host/desktop/build \
            packages/host/enterprise/lib packages/host/connectors/lib \
            packages/host/browser/lib packages/host/cron/lib \
            packages/client/account-card/lib packages/client/branding/lib \
            packages/client/better-sidebar/lib
      - name: Upload workspace build products (one build, three platforms)
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build
          path: workspace-build.tgz
          if-no-files-found: error

  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    # 2026-09-06 恢复 PG 服务:DB 相关测试全量在 CI 执行(serverstore 等按
    # PG_DSN_TEST 临时库隔离),启动重试/迁移改动不再依赖本地容器验证。
    env:
      PG_DSN_TEST: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      # GitHub Actions services 不支持自定义 container command 覆盖
      # (service 的 options 只能拼 docker create 参数,IMAGE 后的 command
      # 无法覆盖),所以步骤内手动 docker run:便于把 max_connections 调高
      # (多测试包+serverstore 池 400 会击穿 PG 默认 100,2026-09-05 beta.1
      # CI 实测),与 docker.yml Verify 步骤同构。
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:18-alpine postgres -c max_connections=500
          for i in $(seq 1 30); do
            if docker exec pg-ci pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready (${i}s)"
              break
            fi
            sleep 1
          done
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      # 2026-09-06 补上门禁缺口(审计 G1/G2):gofmt 与 webadmin 测试此前只在
      # server/Makefile check 中,CI 从未执行。
      - name: gofmt check
        run: |
          FILES="$(gofmt -l cmd internal)"
          if [ -n "$FILES" ]; then
            echo "::error::gofmt 未通过: $FILES"
            exit 1
          fi
      - run: go vet ./...
      # -p 1 串行跑测试包:多个包并行时总连接数仍可能挤压 service 的
      # max_connections(500),串行换取确定性(耗时 ~5-10 分钟,在 30 分钟
      # 窗口内)。
      - run: go test ./... -count=1 -p 1
      - run: npm test
        working-directory: server/webadmin
      - run: make build-server
      - name: Deployment asset syntax checks
        # 部署脚本(deploy.sh / install-server.sh)已于 2026-09-10 移除,此处只校验
        # 仍然发货的部署资产:镜像 entrypoint 的 shell 语法 + compose 配置。
        # defaults.run.working-directory 已是 server/,此处路径不用 server/ 前缀。
        run: |
          bash -n docker/entrypoint.sh
          if command -v docker >/dev/null 2>&1; then
            # 单 compose 文件(caddy+server+postgres):PG_PASSWORD 强必填,
            # 注入后验证语法
            PG_PASSWORD=ci docker compose -f docker-compose.yml config -q
            # 2026-09-02:PG18 挂载点运行验证需要启动 postgres 容器——CI 默认
            # 不依赖数据库,该检查改为 RUN_PG18_MOUNT_CHECK=1 时显式启用
            # (发布/部署验证流水线可设置)。compose 语法校验(上一步)仍始终执行。
            if [ "${RUN_PG18_MOUNT_CHECK:-0}" = "1" ]; then
              # 审计 2026-08-31:PG18 挂载点兼容验证——postgres:18-alpine 的 PGDATA
              # 是 /var/lib/postgresql/18/docker,compose 挂载 ./pg-data:/var/lib/postgresql
              # (父目录)。旧挂载点 /var/lib/postgresql/data 会被 entrypoint 判定为
              # "unused mount/volume" 而拒绝启动(exit 1),导致部署失败。
              # 2026-08-31 修复:临时目录改用 $RUNNER_TEMP(runner 保证可写且宿主可
              # 清理),不再依赖 /tmp;PG 容器以非 root(postgres uid 999)启动,而
              # mktemp -d 创建的目录是 0700 宿主权限——postgres 无法在挂载点内创建
              # 18/ 子目录,容器立即退出(No such container)。挂载点必须放开写权限。
              PG18_MOUNT="$(mktemp -d -p "${RUNNER_TEMP:-/tmp}")"
              chmod 0777 "$PG18_MOUNT"
              if ! PG18_CID="$(docker run -d --rm --name picoaide-ci-pg18 \
                -e POSTGRES_USER=picoaide -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=picoaide \
                -v "$PG18_MOUNT:/var/lib/postgresql" postgres:18-alpine)"; then
                echo "::error::docker run postgres:18-alpine 启动失败(详见上方 docker 输出)"
                rm -rf "$PG18_MOUNT"
                exit 1
              fi
              sleep 8
              if ! docker ps --format '{{.Names}}' | grep -qx picoaide-ci-pg18; then
                echo "::error::postgres:18-alpine 未能在挂载 /var/lib/postgresql 下启动(请检查 compose 挂载点)"
                docker logs "$PG18_CID" 2>&1 | tail -20 || true
                docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
                rm -rf "$PG18_MOUNT" 2>/dev/null || true
                exit 1
              fi
              docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
              rm -rf "$PG18_MOUNT" 2>/dev/null || true
              echo "postgres:18-alpine mount-point check OK"
            else
              echo "PG18 挂载点运行验证跳过(RUN_PG18_MOUNT_CHECK=1 启用)"
            fi
          else
            # 审计 2026-08-25 A-01:docker 缺失时显式失败(此前静默跳过 =
            # compose 语法零验证)。
            echo "::error::docker 不可用,compose 语法校验被跳过"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (linux)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      # Windows 默认 shell 是 pwsh,restore 用 POSIX bash 语法需显式 shell: bash。
      - name: Restore workspace build products
        shell: bash
        run: |
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # 构建产物来自 gate(同一次提交),此处不重复编译(--no-prebuild)。
      - run: yarn workspace dsh-plugin-desktop dist:linux --no-prebuild
      # 客户端 E2E(2026-09-06 接入,G3 缺口):在打包产物上跑 13 项断言
      # (mock gateway + Xvfb + CDP),报告与截图随后上传。
      - name: Client E2E (packaged app, Xvfb)
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          yarn workspace dsh-plugin-desktop e2e:client
      # P2-51: 报告/截图复制必须独立成 step 且 if: always()——原先紧跟 e2e 命令
      # 同一 step 且在其后,`bash -e` 下 e2e 失败即跳过复制,导致 always() 的
      # upload-artifact 上传空目录(与决策文档「失败也留证据」矛盾)。
      - name: Collect E2E report & screenshots
        if: always()
        run: |
          # upload-artifact v4+ 不收录点开头文件/目录(.e2e-report.md/.e2e-shots),
          # 复制并重命名为非点名称再上传(2026-09-06 两轮实测缺失)。
          mkdir -p packages/host/desktop/e2e-results
          cp packages/host/desktop/.e2e-report.md packages/host/desktop/e2e-results/e2e-report.md 2>/dev/null || true
          cp -r packages/host/desktop/.e2e-shots packages/host/desktop/e2e-results/shots 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Linux
          path: |
            packages/host/desktop/dist/*.AppImage
            packages/host/desktop/dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: packages/host/desktop/e2e-results/**
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop (Windows installer)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (windows)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      # Windows 默认 shell 是 pwsh,restore 用 POSIX bash 语法需显式 shell: bash。
      - name: Restore workspace build products
        shell: bash
        run: |
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # 构建产物来自 gate,不重复编译(--no-prebuild);门禁在 gate 已跑,
      # 不再内嵌 check:win-package(--no-gates),但打包后 verify-win-installer
      # 仍在脚本内执行。
      - run: yarn workspace dsh-plugin-desktop dist:win --no-prebuild --no-gates
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Windows-installer
          path: packages/host/desktop/dist/*Setup*.exe
          if-no-files-found: error

  # macOS 单 job 三态:正式 tag(纯 vX.Y.Z)打包+签名+公证(可重试);预发 tag
  # (vX.Y.Z-*,如 beta/rc)只签名不公证——Releases 页面可见、真机可装(首次
  # 右键打开),免去每次 1-5 小时公证排队;其他(PR/分支)只做未签名冒烟。
  # 合并而非互斥 job:Release job 的 needs 需要稳定的 mac 依赖(两颗互斥 job
  # 会让 Release 因 needs 里某颗被 skip 而连带 skip,2026-09-05 beta.1 实测)。
  desktop-macos:
    name: Desktop (macOS)
    needs: gate
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (macos)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      - name: Restore workspace build products
        run: |
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # App Store Connect API Key:secret 里存的是 .p8 文件内容,写入临时文件
      # 以路径形式传给 electron-builder(正式分支专用;冒烟分支不ary用)。
      - name: Materialize App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # 构建产物来自 gate,不重复编译;门禁与根 check 在 gate 已跑
      # (--no-prebuild --no-gates)。
      # ==== 正式分支:打包(含完整 gate)+签名,公证在下一步(可续等) ====
      - name: Pack and sign app bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # preflight 校验整体发布凭据完整性(含公证三元组),pack 不公证但需通过
          # 校验——不传会在"Pack"步骤提前 fail(2026-09-05 rc.3 实测)。
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Notarize and build DMG (resumable)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        run: |
          for attempt in 1 2 3; do
            echo "attempt ${attempt}/3: yarn dist:mac:notarize"
            if yarn workspace dsh-plugin-desktop dist:mac:notarize --no-prebuild; then
              echo "notarized DMG built on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt ${attempt} failed; retrying in 60s (same submission resumed)"
              sleep 60
            fi
          done
          exit 1
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # ==== 预发 tag(vX.Y.Z-beta.N / -rc.N):签名不公证(preflight 免公证元组) ====
      - name: Pack and sign app bundle (prerelease, sign-only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates --sign-only
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - name: Build signed DMG without notarization (prerelease)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:dmg --no-prebuild
      # ==== 非正式分支(PR/分支):未签名冒烟,不进签名公证 ====
      - name: Build unsigned smoke DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke --no-prebuild --no-gates
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  # 发布(2026-09-10 改版):GitHub Release **仍然发布**,但内容物从"客户端安装包"
  # 改为"服务端镜像压缩包"。两条分发面分工见
  # docs/planning/2026-09-10-r2-update-server-runbook.md §0.1:
  #   - 更新服务器(R2 release.picoaide.com):热分发面,只留最近 3 个版本,服务端
  #     updatecheck 与客户部署从这里取;
  #   - GitHub Release(本 job):冷存档 + 变更记录,永久保留全部历史版本镜像,
  #     审计/查变更/取更老版本镜像时用。
  # 客户端安装包不再单独发布:它已经在镜像里,由服务端自行下发。
  release:
    name: Release (server image archive)
    # 只对 beta 与 official 发布到 GitHub Release(2026-09-10 定案):
    # 品牌渠道是客户定制交付,不进公开 Releases(客户从更新服务器自己的渠道目录取)。
    # 渠道由 tag 形态决定,与 resolve 步骤同源。
    if: startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || !contains(github.ref_name, '-'))
    needs: [server, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write      # 推镜像到 GHCR(客户端资产只有这里拿得到,故构建点在本 job)
    outputs:
      # 渠道传递给 publish-update-server:两个 job 必须写同一个渠道目录,
      # 否则会出现"镜像传 official、清单传 beta"的错配。
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 三平台安装包仍需先构建:它们要打进镜像(客户端随镜像分发)。
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      # 审计 2026-08-25 复查【7】:release job 需要显式 node(ubuntu 镜像自带
      # 版本非保证),tag 校验的 node -p 才有确定性环境。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 发布前强制校验 tag == 两处 package.json version(scripts/version.mjs 是
      # 唯一真源;版本号只改一处会让发布成功但升级源永久对不上)。不一致 fail-loud。
      - name: Verify tag matches package versions
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME"

      # 渠道解析(2026-09-10):三种渠道类型互不升级,发布面必须分开。
      #   beta     = 预发布 tag(含 `-`,如 v2.7.0-beta.1),我们自己内测
      #   official = 正式 tag(vX.Y.Z)
      #   品牌渠道 = workflow_dispatch 显式指定(wf_channel 输入)
      # 渠道值贯穿:客户端清单 channel_id、镜像 label、R2 上传目录、
      # latest.json.channel_id。写错 = 客户端/服务端跨渠道升级。
      - name: Resolve release channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 渠道由 tag 形态决定,且**只支持 beta / official**:
          #   beta     = 预发布 tag(含 `-`,如 v2.7.0-beta.1),我们自己内测
          #   official = 正式 tag(vX.Y.Z)
          #
          # 品牌渠道**故意在这里 fail-loud**(2026-09-10):它需要独立的渠道配置包
          # (品牌名/图标/appId/默认服务器地址/更新源)与按渠道矩阵化的打包,
          # 见 docs/planning/2026-09-04-enterprise-channel-branding.md。
          # 在渠道管线落地前,任何看似品牌渠道的 tag 都必须停下 —— 静默按 official
          # 发布会让品牌客户端被官方清单升级、品牌被"洗掉"(最严重的一类错)。
          if [[ "${TAG}" == *-* ]]; then
            # 预发布:再区分是不是品牌渠道标记(约定品牌 tag 形如 v2.7.0-<channel-id>.N)
            case "${TAG}" in
              *-beta.*|*-beta|*-rc.*|*-rc|*-alpha.*|*-alpha)
                CH=beta ;;
              *)
                echo "::error::无法从 tag ${TAG} 判定渠道:品牌渠道发布需要渠道配置包与渠道化打包管线(尚未实施)。"
                echo "::error::请改用 vX.Y.Z(官方)或 vX.Y.Z-beta.N(预发)形态的 tag。"
                exit 1 ;;
            esac
          else
            CH=official
          fi
          # 与客户端 CHANNEL_ID_PATTERN / 服务端 IsChannelID 同源的形状校验,
          # 防畸形路径注入到 R2 key 与清单
          if ! printf '%s' "$CH" | grep -Eq '^[a-z0-9][a-z0-9-]{0,31}$'; then
            echo "::error::非法渠道 id: ${CH}(期望 ^[a-z0-9][a-z0-9-]{0,31}$)"
            exit 1
          fi
          echo "channel=${CH}" >> "$GITHUB_OUTPUT"
          echo "渠道 = ${CH}(tag ${TAG})"

      - name: Assemble client assets into the image build context
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"    # 本 step 独立取版本(不跨 step 复用变量)
          # 客户端资产平铺在一个目录:entrypoint 落盘后由服务端按文件名下发。
          # 目录必须存在(Dockerfile 用目录形式 COPY;缺目录会构建失败)。
          mkdir -p client-assets/client
          cp release-artifacts/*.exe   client-assets/client/ 2>/dev/null || true
          cp release-artifacts/*.dmg   client-assets/client/ 2>/dev/null || true
          cp release-artifacts/*.AppImage client-assets/client/ 2>/dev/null || true
          cp release-artifacts/*.deb   client-assets/client/ 2>/dev/null || true
          if [ -z "$(ls -A client-assets/client)" ]; then
            echo "::error::no client installers found in release-artifacts"
            exit 1
          fi
          ls -lh client-assets/client/
          # 客户端资产清单:镜像内携带,服务端据此生成
          # GET /api/client/v2/updates/manifest。
          # 必须用 **client.version / client.assets** 结构:客户端解析器
          # (packages/host/desktop/src/desktop-release.ts 的 parseReleaseManifest)
          # 只认这一种形状,且强制 url 绝对 https、sha256 为 64 位小写 hex。
          # 这里 url 用官方基址占位;服务端对外下发时会按自身地址重写
          # (客户端因此始终从自己登录的服务器取包)。
          CH="${{ steps.channel.outputs.channel }}"
          BASE="https://release.picoaide.com/${CH}/releases/${VER}"
          {
            echo '{'
            echo '  "schema": 1,'
            echo "  \"channel_id\": \"${CH}\","
            echo '  "client": {'
            echo "    \"version\": \"${VER}\","
            echo '    "assets": {'
            first=1
            add() { # $1=清单键 $2=文件名
              [ -f "client-assets/client/$2" ] || return 0
              [ "$first" = 1 ] || echo ','
              first=0
              printf '      "%s": { "file": "%s", "url": "%s/%s", "sha256": "%s", "size": %s }' \
                "$1" "$2" "$BASE" "$2" \
                "$(sha256sum "client-assets/client/$2" | cut -d' ' -f1)" \
                "$(stat -c%s "client-assets/client/$2")"
            }
            add mac-universal "$(basename "$(ls client-assets/client/*.dmg | head -1)" 2>/dev/null || echo -)"
            add win-x64       "$(basename "$(ls client-assets/client/*.exe | head -1)" 2>/dev/null || echo -)"
            add linux-x64     "$(basename "$(ls client-assets/client/*.AppImage | head -1)" 2>/dev/null || echo -)"
            echo
            echo '    }'
            echo '  }'
            echo '}'
          } > client-assets/CLIENT-RELEASE.json
          node -e "JSON.parse(require('fs').readFileSync('client-assets/CLIENT-RELEASE.json','utf8')); console.log('CLIENT-RELEASE.json 合法')"
          cat client-assets/CLIENT-RELEASE.json

      # 渠道配置来自**私有仓** picoaide/channels:客户可见的名称/文案/标识不在
      # 公开仓里,不同渠道的内容彼此隔离。检出到 channels/(与本地开发同路径,
      # 后续构建步骤与 Dockerfile 无需感知来源)。
      #
      # 需要 repo secret CHANNELS_REPO_TOKEN:一个能读该私有仓的令牌
      # (fine-grained PAT 只给 picoaide/channels 的 Contents:Read 即可)。
      # 缺少时**直接失败**:静默回落到公开占位内容会让客户看到错的品牌。
      - name: Check out channel content (private repo)
        env:
          CHANNELS_REPO_TOKEN: ${{ secrets.CHANNELS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHANNELS_REPO_TOKEN}" ]; then
            echo "::error::缺少 secret CHANNELS_REPO_TOKEN —— 无法读取私有渠道仓 picoaide/channels"
            echo "::error::请创建一个只读该仓 Contents 的 fine-grained PAT,并添加为仓库 secret"
            exit 1
          fi
          # 先克隆到临时目录再就位:仓库里已有 channels/README.md(git 不跟踪的
          # 占位说明),而 `git clone` 到**非空目录**会直接失败 —— 若先 rm 再裸克隆,
          # 克隆失败时会留下"上一轮的残留内容",后续步骤照样跑完并发错镜像。
          # 这里克隆失败即中止,不留下可被误用的半成品。
          rm -rf .channels-clone channels
          git clone --depth 1 \
            "https://x-access-token:${CHANNELS_REPO_TOKEN}@github.com/picoaide/channels.git" \
            .channels-clone
          # 校验:这确实是一个含 channels/ 的渠道仓
          if [ ! -d .channels-clone/channels ]; then
            echo "::error::picoaide/channels 里没有 channels/ 目录(仓库结构不符)"
            exit 1
          fi
          # 只把仓库里的 channels/ 内容搬到工作区 channels/。
          # 注意路径层数:渠道仓自身的结构是 `<repo>/channels/<id>/`(便于单独 clone
          # 阅读),而工作区要的是 `channels/<id>/` —— 直接 mv 整个 clone 会多一层,
          # 变成 channels/channels/<id>/,后面的 channels/<id>/channel.json 就找不到。
          COMMIT="$(git -C .channels-clone rev-parse --short HEAD)"
          rm -rf channels
          mkdir -p channels
          cp -a .channels-clone/channels/. channels/
          rm -rf .channels-clone
          echo "已检出渠道仓(commit ${COMMIT})"
          ls -1 channels/

      # 把选定渠道复制成镜像构建上下文,并校验配置自洽。
      - name: Assemble channel config into the image build context
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          if [ ! -f "channels/${CHANNEL}/channel.json" ]; then
            echo "::error::私有渠道仓里没有 channels/${CHANNEL}/channel.json"
            test "$CHANNEL" = official || echo "::error::品牌渠道需先在该仓创建 channels/${CHANNEL}/(复制 channels/official/)"
            exit 1
          fi
          # 目录名 = 渠道 id:镜像构建用 --build-arg CHANNEL=<id> 选择要打进镜像的渠道
          mkdir -p "channels-context/${CHANNEL}"
          cp -a "channels/${CHANNEL}/." "channels-context/${CHANNEL}/" 
          # 校验:JSON 合法 + channel_id 与目录名一致(不一致会让服务端下发错的渠道标识,
          # 也会让 updatecheck 的渠道隔离判为不可用)。用 env 传值,避免 shell 注入。
          CHANNEL_ID="$CHANNEL" node -e "
            const fs=require('fs');
            const id=process.env.CHANNEL_ID;
            const p='channels-context/'+id+'/channel.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            if(c.channel_id!==id){
              console.error('::error::channel.json 的 channel_id='+c.channel_id+' 与渠道 '+id+' 不一致');
              process.exit(1);
            }
            fs.writeFileSync('channels-context/'+id+'/VERSION', process.env.GITHUB_REF_NAME||'');
            console.log('渠道配置校验通过:', id);
          "
          ls -la "channels-context/${CHANNEL}/" 

      - name: Build server image for the release tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          IMAGE="picoaide-harness-server"   # 仅本地构建 tag,不推任何仓库
          # 本 job 是镜像的**唯一构建点**:只有这里同时拿得到三平台客户端资产
          # (gate 的 workspace-build + 三个 desktop-* artifact)与发布上下文。
          # channels 提供渠道内容(名称/文案/标识);webadmin 不再编译期注入
          # 任何品牌素材(2026-09-10 审计:仓库里不留品牌描述)。
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION="$VER" \
            --build-arg CHANNEL="${{ steps.channel.outputs.channel }}" \
            --build-context clientassets=./client-assets \
            --build-context channelassets=./channels-context \
            --label "org.opencontainers.image.source=https://github.com/picoaide/picoaide-harness" \
            --label "org.opencontainers.image.version=$VER" \
            --tag "${IMAGE}:v${VER}" \
            --load \
            server
          # 不再推送任何镜像仓库(2026-09-10:GHCR 已下线)。
          # 镜像的唯一分发面是更新服务器 release.picoaide.com(R2):
          # 下面 export 出来的 zip 由 publish-update-server job 上传,客户从这里取。
          # 本地 tag 仅用于紧接着的 export 步骤。

      - name: Export compressed image archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          ARCHIVE="picoaide-server-${VER}-amd64.zip"
          # 先 docker save 到临时 tar,再打成 zip(2026-09-10:按部署要求改用 zip,
          # 不用 zstd —— zip 在任何运维环境都开箱可用,不依赖额外安装 zstd)。
          # 归档内是单个 image.tar;导入方式:
          #   unzip -p <归档> image.tar | docker load
          # sha256 一并产出供更新服务器 SHA256SUMS 与人工校验。
          # 注意:zip 对已压缩内容(docker 层)无法再压,用 -1 快速模式避免白耗 CPU。
          docker save "picoaide-harness-server:v${VER}" -o image.tar
          zip -1 -q "$ARCHIVE" image.tar
          rm -f image.tar
          sha256sum "$ARCHIVE" | sed 's# .*/# #' > SHA256SUMS
          ls -lh "$ARCHIVE" SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="picoaide/picoaide-harness"
          NOTES_FLAG="--notes-file docs/releases/${TAG}.md"
          if [ -f "docs/releases/${TAG}.md" ]; then
            echo "Using curated release notes from docs/releases/${TAG}.md"
          else
            echo "::warning::docs/releases/${TAG}.md not found — falling back to GitHub auto-generated notes"
            NOTES_FLAG="--generate-notes"
          fi
          # prerelease tag(含 prerelease 段)按 GitHub 语义以 Pre-release 发布:
          # 可见但不会被当成 Latest。正式 tag 发布为普通 release。
          PRERELEASE=""
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE="--prerelease"
            echo "Releasing ${TAG} as a prerelease"
          fi
          # 幂等(2026-09-06):同 tag 重跑时 release 已存在会 422 —— 先查再决定
          # create/edit,并用 --clobber 覆盖旧资产(旧资产是上次运行的产物)。
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating title/notes/flags and clobbering assets"
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "PicoAide Harness ${TAG}" ${NOTES_FLAG} ${PRERELEASE}
            gh release upload "${TAG}" --repo "${REPO}" --clobber \
              *.zip SHA256SUMS
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --title "PicoAide Harness ${TAG}" ${NOTES_FLAG} ${PRERELEASE} \
              *.zip SHA256SUMS
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # 更新服务器(R2)上传:需要 R2 secrets,尚未配置时**跳过而非失败**,保证
  # Release 本身可用。配置好 R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID /
  # R2_SECRET_ACCESS_KEY 后自动启用。上传细节与保留策略见
  # docs/planning/2026-09-10-r2-update-server-runbook.md §5。
  publish-update-server:
    name: Publish to update server (R2)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check R2 credentials
        id: creds
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ]; then
            echo "::warning::R2 secrets 未配置 —— 跳过更新服务器上传(不影响 GitHub Release)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.skip == 'false'
      - name: Download release archive
        if: steps.creds.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo picoaide/picoaide-harness \
            --pattern '*.zip' --pattern 'SHA256SUMS' --dir release-bundle
          ls -lh release-bundle
      - name: Generate latest.json
        if: steps.creds.outputs.skip == 'false'
        env:
          VERSION: ${{ github.ref_name }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"; CH="${CHANNEL}"
          # schema 权威定义见 R2 手册 §6;client.assets 当前不填(客户端包在镜像里)
          cat > release-bundle/latest.json <<JSON
          {
            "schema": 1,
            "channel_id": "${CH}",
            "server": {
              "version": "${VER}",
              "image_tag": "v${VER}",
              "image_asset": "https://release.picoaide.com/${CH}/releases/${VER}/picoaide-server-${VER}-amd64.zip"
            },
            "client": { "version": "${VER}" },
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat release-bundle/latest.json
      - name: Upload to R2 and prune old versions
        if: steps.creds.outputs.skip == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ github.ref_name }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          set -euo pipefail
          aws="aws --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          VER="${VERSION#v}"; CH="${CHANNEL}"; BASE="s3://${R2_BUCKET}/${CH}"
          IMMUTABLE='public, max-age=31536000, immutable'

          # 1) 版本化资产(不可变、长缓存)
          $aws s3 cp release-bundle/*.zip "$BASE/releases/${VER}/" \
            --content-type application/zip --cache-control "$IMMUTABLE"
          $aws s3 cp release-bundle/SHA256SUMS "$BASE/releases/${VER}/SHA256SUMS" \
            --content-type text/plain --cache-control "$IMMUTABLE"

          # 2) 清理到最近 3 个版本(版本序 sort -V,不能字典序:2.10.0 > 2.9.0)
          $aws s3 ls "$BASE/releases/" | awk '{print $2}' | sed 's#/##' \
            | sort -rV | tail -n +4 | while read -r old; do
                echo "prune $CH/releases/$old"
                $aws s3 rm "$BASE/releases/$old/" --recursive
              done

          # 3) 版本指针最后覆盖(短缓存,新版本才能立即可见)
          $aws s3 cp release-bundle/latest.json "$BASE/latest.json" \
            --content-type application/json --cache-control 'no-cache'

  # PR 场景:把本次提交的编译产物汇总评论到 PR(fork 分支 token 只读,跳过)。
  pr-summary:
    name: PR build artifacts summary
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs: [desktop-linux, desktop-windows, desktop-macos, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- picoaide-ci-artifacts -->'
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '## CI 编译产物',
              '',
              '本次提交的门禁（gate + server + 三平台打包）全部通过，可下载产物：',
              '',
              `- Desktop (Linux): \`desktop-Linux\` — AppImage + deb（含 \`e2e-report\` 客户端 E2E 结果）`,
              `- Desktop (Windows): \`desktop-Windows-installer\` — NSIS Setup`,
              `- Desktop (macOS): \`desktop-macOS\` — DMG`,
              `- Server: \`picoaide-server-linux-amd64\` — Go 服务端二进制`,
              '',
              `下载入口：[Actions 运行页 → Artifacts](${runUrl}#artifacts)`,
            ].join('\n')
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            for (const comment of comments.data) {
              if (comment.body && comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                })
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
