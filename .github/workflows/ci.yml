name: CI

on:
  pull_request:
  push:

# 审计 2026-08-25 D-3:顶层权限收窄为 contents: read(actions: write 对纯 CI
# 仓库非最小)。release job 在自身声明 contents: write;pr-summary 声明
# pull-requests: write;gate/平台 job 声明 actions: write(artifact 上传)。
permissions:
  contents: read

# 审计 2026-08-25 D-2:同 ref 并发触发(重推 tag/两 tag)互斥,release 不再
# 并行争抢同一版本。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

# ============================================================================
# 重设计(2026-09-06,见 docs/decisions/2026-09-06-ci-pipeline-redesign.md):
#   gate    = 平台无关门禁 + 全 workspace 一次构建(产物上传,喂三平台 job)。
#   server  = Go + webadmin 门禁 + server 二进制。
#   desktop-* = needs: gate,下载构建产物,只做平台专属打包/验证/E2E,
#              不再重复编译(打包脚本 --no-prebuild / --no-gates)。
#   每个 push/PR 提交都产出:三平台安装包 + server 二进制(Artifacts 可下载),
#   PR 由 pr-summary 评论指引;tag 走 mac 签名 + release job 发布。
# ============================================================================

jobs:
  # 2026-09-17:只改文档(docs/、site/、任意 *.md)时跳过全部重活。
  # **不能**用 workflow 级 paths-ignore:那会让必需检查停在 Pending,受保护的 PR
  # 永远合不了(官方 Troubleshooting required status checks 明说"不要对必需检查用
  # 路径过滤")。改为「永远运行的 changes job + job 级 if」——被 if 跳过的 job 在
  # 分支保护里按 Success 计(文档:success/skipped/neutral 都算通过)。
  # 判据:diff 里出现任何 docs/ site/ *.md 之外的文件 => code=true;检测本身失败
  # 也按 true 处理(fail-safe,宁可多跑)。
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          # tag 一律按"有代码改动"处理:发布链必须完整跑(且 tag 的 before 常是全零)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${GITHUB_SHA}"
          fi
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "${BASE}" "${HEAD}" || true)"
          if [[ -z "${CHANGED}" ]]; then
            # 空 diff(空提交/强制推送后的未知状态)按有改动处理
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # docs-only 的判定是**正面清单**(2026-09-23 第三轮审计 R3-C C-3 / C-CI-1)。
          #
          # 曾经写的是 `docs/*|site/*|*.md` —— bash `case` 的 `*` **跨 `/`**,所以
          # "任意深度的 markdown"都算文档:包括 `server/skills/**/*.md`(随包交付给
          # 客户的技能文档,由 `TestBuiltinSkillVersionTracksContent` 的内容摘要门禁
          # 守着,实测追加一行注释就红)与 `packages/**/*.md`。那些文件的真正判据在
          # Go 测试 / 包 check 里 ⇒ 走 docs-only = 那些 job 全跳过 = 零门禁通过。
          #
          # 现在的规则(唯一实现,`check-workflows.mjs` 的 [SK-10] 逐条对拍,**改宽改窄
          # 都红**):
          #   docs/**、site/**            → 文档面
          #   任何**含 `/` 的其它路径**   → 代码(含 server/skills/**/*.md 这类随包文档)
          #   仓库根的 markdown           → 文档面(README/CONTRIBUTING/AGENTS… 没有
          #                                 包级/Go 判据;铁律 0 等根守卫另由
          #                                 `Gate (root guards, every change)` 兜住)
          #   其余                        → 代码
          DOCS_ONLY=1
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              docs/*|site/*) ;;
              */*) DOCS_ONLY=0; break ;;
              *.md) ;;
              *) DOCS_ONLY=0; break ;;
            esac
          done <<< "${CHANGED}"
          if [[ "${DOCS_ONLY}" == "1" ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report scope
        run: echo "docs-only=${{ steps.scope.outputs.code == 'false' }}（code=${{ steps.scope.outputs.code }}）"

  # 2026-09-23 第三轮审计 R3-C C-3:**永远运行的小 job** —— 只跑根守卫。
  #
  # 为什么单独一个 job:docs-only 的 PR 会让"重活"(gate/server/desktop-*)整条跳过,
  # 而 GitHub 分支保护把 skipped 的必需检查记成**成功**(`gh api
  # repos/.../branches/master/protection` 的必需检查含 Gate;线上 PR #129 的 Gate 就是
  # skipped 之后合并的)⇒ 判据落在文档上的根守卫(铁律 0 的域名、迁移区间、文档数字、
  # 布局记录)一次都不跑。本 job **没有 `if:`、也没有 `needs:`** —— 结构上无法被跳过,
  # 因而在**任何** PR / 推送形态下都会真的跑那批不依赖构建产物的根守卫
  # (`scripts/check-root-guards.mjs`,清单来自 `scripts/check-workspaces.mjs` 的 GUARDS
  # 表,≈1 分钟)。
  #
  # 建议把本 job 加进分支保护(它一失败就是红的,独立可读);在加之前,gate 的第一步
  # 会检查它的结果 —— 它没成功 ⇒ 必需的 `Gate (tests + workspace build)` 一起红,
  # 所以"守卫失败但 PR 还能合"这条路现在不存在。
  gate-guards:
    name: Gate (root guards, every change)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # 根守卫里的 check-no-real-domains 要扫提交信息区间 ⇒ 必须能看见历史
          # (2026-09-23 审计 R3-C C-4;守卫侧另有 fail-loud 兜底)。
          fetch-depth: 0
      # 顺序约束(2026-09-06 实测):setup-node@v7 默认 enable-corepack: false 且会重排
      # PATH —— corepack enable 必须在 setup-node 之后执行,否则 yarn shim 被覆盖。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn (and electron for the linux packaging job)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      # 清单与运行器:`scripts/check-root-guards.mjs` 解析编排器的 GUARDS 表(解析不到
      # 即 fail-loud),不跑任何 workspace 包的 check(那部分属于下面的 gate)。
      - name: Root guards (every PR shape)
        run: node scripts/check-root-guards.mjs

  gate:
    name: Gate (tests + workspace build)
    # gate-guards 是"永不跳过"的守卫 job;changes 只提供 docs-only 判定。
    needs: [changes, gate-guards]
    # 2026-09-23 第三轮审计 R3-C C-3:**本 job 永不因 docs-only 而跳过**。
    #
    # 此前这里是 `if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'`,
    # 于是"只改文档"的 PR 会把整条 gate 跳过。现在:重活仍按 docs-only 跳过(那正是
    # 这个开关的用途),但**根守卫已经不在本 job 里**了 —— 它们在 gate-guards(永不
    # 跳过),而本 job 的第一件事就是检查那个 job 的结果。
    #
    # 判据 `!cancelled()`,不是 `success()`:changes 失败(而非判定 docs-only)时照跑 ——
    # 那时输出为空,下面按"完整路径"处理(宁可多跑,不可漏测);只有整个 run 被取消
    # (并发互斥,见文件头 concurrency)才不空烧 runner。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      # 必需的 `Gate (tests + workspace build)` 必须反映守卫 job 的结果:守卫失败 ⇒
      # 本步红 ⇒ 必需检查红(静态策略 [SK-9] 钉住这条链路)。
      - name: Root guards must have passed
        if: needs.gate-guards.result != 'success'
        run: |
          set -euo pipefail
          echo "::error::根守卫 job 未成功(result=${{ needs.gate-guards.result }})⇒ 门禁整体失败"
          echo "::error::见 job「Gate (root guards, every change)」的输出;docs-only 的 PR 也必须让它绿。"
          exit 1
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # 2026-09-23 第三轮审计 R3-C C-4:此前没有 `fetch-depth`(默认 1),而
          # check-no-real-domains 的**提交信息判据**要先解析出区间 base —— PR 的检出
          # ref 是 `refs/pull/N/merge`,`origin/<base>` 往往根本不存在,depth-1 下四个
          # 候选全部解析失败,判据于是静默退化成"只看 HEAD"(= 那条 merge commit),
          # 中间提交信息里的域名一个都看不见。实测同一份历史:完整克隆 EXIT=1、
          # depth-1 克隆 EXIT=0 且照打"零命中 ✅"。
          # changes job 早就付过这个成本,同一个仓不是新增量级;守卫侧另有 fail-loud
          # 兜底(区间解析不到即 EXIT=3),这条是让它**不需要**触发的那一半。
          fetch-depth: 0
      # ref 形态 → 渠道集 / 是否发布的**唯一真源**(2026-09-23 审计 K-04)。
      #
      # 为什么放在 gate 的第一步:这条规则曾经有两份实现(ci-channels.sh 的 bash
      # glob + release job 的 `if:`),两者对"名字带 `-` 但后缀不认识"的 tag 结论
      # 相反 —— 一个 `v2.8.2-hotfix` 会跑满三平台构建(含品牌渠道),而 release job
      # 整体被跳过:零交付 + 客户侧零信号,品牌产物还留在 R2 中转前缀里没人清理。
      # 现在形态判定只有 `scripts/ci-release-policy.sh` 一处:不认识就**当场红**
      # (1 分钟内),desktop-* / release 因 `needs: gate` 全部跳过 ⇒ 不会再有
      # "构建了却不发布"的空转。判据与渠道集见该脚本头部注释。
      - name: Classify the release tag (single source of truth)
        id: release_policy
        run: |
          set -euo pipefail
          bash scripts/ci-release-policy.sh >> "$GITHUB_OUTPUT"
      # 正式 tag 必须有策展发布说明(2026-09-11 定案):GitHub Release 页是**公开面**,
      # 缺 docs/releases/<tag>.md 时 release job 会回退自动生成的 PR 列表 —— 版本页
      # 变成 CI 日志(v2.7.0 的实际情况)。这条检查放在 gate 的第一步:tag 打错时
      # 1 分钟内就报,不必等三平台构建 40 分钟才在最后一步失败。预发 tag 允许缺失。
      # 「正式 / 预发」同样取自上面的唯一真源,不再写 `!contains(ref_name,'-')` 这类
      # 名字形状判断 —— 那种写在 `if:` 里的第二份判据正是 K-04 的根因形态。
      - name: Require curated release notes for stable tags
        if: steps.release_policy.outputs.release_kind == 'stable'
        run: |
          set -euo pipefail
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "::error::正式版缺少发布说明 docs/releases/${GITHUB_REF_NAME}.md(模板见 docs/releases/TEMPLATE.md)"
            exit 1
          }
          echo "OK: docs/releases/${GITHUB_REF_NAME}.md"
      # 顺序约束(2026-09-06 实测):setup-node@v7 默认 enable-corepack: false
      # 且会重排 PATH——corepack enable 必须在 setup-node 之后执行,否则
      # Windows 上 yarn shim 被覆盖,install 落到全局 Yarn 1.22(实测报错)。
      # docs-only ⇒ 本 job 只做上面的"守卫结果检查 + tag 形态/发布说明检查",不构建。
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: 24
      - if: needs.changes.outputs.code != 'false'
        run: corepack enable
      - name: Cache yarn (and electron for the linux packaging job)
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - if: needs.changes.outputs.code != 'false'
        run: yarn install --immutable
      # 渲染进程错误采集门禁(verify:renderer-capture,2026-09-16)是**图形**门禁:
      # 要真起 Electron 并在页面主世界抛错。runner 镜像通常自带 xvfb,这里仍与
      # desktop-linux job 一样做防御式安装 —— 该门禁在无 DISPLAY 且无 xvfb-run 时
      # **故意 fail-loud**(不静默跳过),所以装不上会红,而不是悄悄变绿。
      # 只有完整路径会跑到那个图形门禁,docs-only 时不必装。
      - name: Ensure xvfb for the graphical gate
        if: needs.changes.outputs.code != 'false'
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
      # 根 check(2026-09-06 重排):desktop check 最前(一次构建产出桌面 lib/types,
      # 其余包 tsc 依赖),随后其余包 check,全程每包只构建一次。
      # 判据用 `!= 'false'` 而不是 `== 'true'`:changes 失败/输出为空时走完整路径
      # (fail-safe)。参数向量必须保持为空(禁止 --no-guards / --only / --changed /
      # check:fast)—— 这条由 check-workflows.mjs 的 [SK-8] 静态策略守着。
      # **根守卫也在 `yarn check` 里**,但那条路径只对"有代码改动"的 PR 生效;
      # docs-only 的 PR 由永不跳过的 gate-guards job 承担(见上面的注释)。
      - name: Full gate (packages + all root guards)
        if: needs.changes.outputs.code != 'false'
        run: yarn check
      # W-5(2026-09-23 第三轮审计):WASM 协议的 4 个探针此前**零自动化**(`.github/`
      # 对它 0 引用;组 6 只在本地手跑)。接在这里的原因:本 job 已装 xvfb(`yarn check`
      # 里的图形门禁需要它)、也已 `yarn install`(探针用仓内 Electron)⇒ 接线成本 = 一个
      # step,实测 21s(4/4 PASS)。
      # 只接 Linux:Windows/macOS 的自定义协议行为尚未实测,探针在非 Linux 上显式
      # SKIP(77);组内本轮新增的"**全组 SKIP = 失败**"保证 Linux 上哪天全 SKIP 也不会
      # 装作跑过(不留"跑完给结论"的假象)。
      - name: WASM protocol probes (group 6; Linux)
        if: needs.changes.outputs.code != 'false'
        env:
          WASM_GATE_REQUIRE_COVERED_PLATFORM: '1'
        run: bash scripts/verify-wasm-client-only.sh --groups 6
      # 2026-09-06 实测:upload-artifact 对多 glob path 会按各条目的根拍平目录
      # 结构(下载后 lib/ 树丢失),故先 tar 打包为单文件,目录结构自控。
      - name: Package workspace build products
        if: needs.changes.outputs.code != 'false'
        run: |
          set -euo pipefail
          tar -czf workspace-build.tgz \
            packages/host/desktop/lib packages/host/desktop/build \
            packages/host/enterprise/lib packages/host/connectors/lib \
            packages/host/browser/lib packages/host/cron/lib \
            packages/host/wasm-apps-host/lib packages/host/host-locale/lib \
            packages/host/host-home/lib \
            packages/client/account-card/lib packages/client/branding/lib \
            packages/client/wasm-apps/lib packages/client/panel-surface/lib \
            packages/client/foot-menu/lib \
      - name: Upload workspace build products (one build, three platforms)
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build
          path: workspace-build.tgz
          if-no-files-found: error

  server:
    name: Go server
    needs: changes
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # 45 min 的依据(2026-09-19,R2-SK-7):happy path ≈ 26 min 测试 + PG 启动/
    # npm ci/gofmt/go vet/npm test/make build-server ≈ 5 min ⇒ 留 ~1.4× 余量;
    # 且覆盖"单包挂满 15m + 其余 ~21m ≈ 36 min"的最坏路径,使 -timeout 的
    # goroutine dump 一定能打出来(取 30 min 时这两条都不成立:余量仅 ~13%,
    # runner 稍慢即同提交红,真挂则无 dump)。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    # 2026-09-06 恢复 PG 服务:DB 相关测试全量在 CI 执行(serverstore 等按
    # PG_DSN_TEST 临时库隔离),启动重试/迁移改动不再依赖本地容器验证。
    env:
      PG_DSN_TEST: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      # GitHub Actions services 不支持自定义 container command 覆盖
      # (service 的 options 只能拼 docker create 参数,IMAGE 后的 command
      # 无法覆盖),所以步骤内手动 docker run:便于把 max_connections 调高
      # (多测试包+serverstore 池 400 会击穿 PG 默认 100,2026-09-05 beta.1
      # CI 实测),与 docker.yml Verify 步骤同构。
      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          docker run -d --name pg-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:18-alpine postgres -c max_connections=500
          for i in $(seq 1 30); do
            if docker exec pg-ci pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready (${i}s)"
              break
            fi
            sleep 1
          done
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      # 2026-09-06 补上门禁缺口(审计 G1/G2):gofmt 与 webadmin 测试此前只在
      # server/Makefile check 中,CI 从未执行。
      - name: gofmt check
        run: |
          set -euo pipefail
          FILES="$(gofmt -l cmd internal)"
          if [ -n "$FILES" ]; then
            echo "::error::gofmt 未通过: $FILES"
            exit 1
          fi
      - run: go vet ./...
      # -p 1 串行跑测试包:多个包并行时总连接数仍可能挤压 service 的
      # max_connections(500),串行换取确定性。实测全量 wall ≈ 26 min
      # (2026-09-19,4 vCPU 与 runner 同规格,51 包全绿;最慢单包
      # llmgateway 298.9s、serverstore 165-189s)。
      #
      # 单包 -timeout 必须远小于 job 预算,否则"真挂"的诊断会丢:取 25m 时,
      # 挂起的那个包要烧满 25 min,其余包还要 ~21 min ⇒ 必然先撞 job 上限被
      # 整体取消,产物从 `panic: test timed out after Nm` + goroutine dump +
      # 用例名,退化成"gate 红、查不出原因"(第二轮审计 R2-SK-7,P2)。
      # 15m 对最慢包(299s)有 3× 余量,且保留 dump 机会。
      #
      # W-4(2026-09-23 第三轮审计):只取 `go test` 的退出码会让"PG 不可达 ⇒ 全部
      # `t.Skip` ⇒ 0 断言通过"变成门禁绿 ⇒ 这里落 `-json` 报告,再交给判定脚本按
      # 「**用例级 0 skip** + 三条关键用例确实 pass」判。该判据脚本此前只被组 3 调用,
      # 而组 3 没有任何 job 跑(`.github/` 对它 0 引用)⇒ 判据从不执行。
      #
      # **范围**:`--scope internal/wasmapp,internal/router,internal/marketplace,internal/agentshare`
      # (**不带尾斜杠** —— 带尾斜杠会漏掉 `internal/router` 根包自己的 65 个用例事件,实测)。
      # 前两段与组 3 同面;后两段是第三轮修复补齐的:渠道命名空间守卫(A-8/F1-F6)的用例
      # 全在这两个包里,而它们**依赖真 PG** —— PG 不可达时 `serverstore.NewTestDB` 会
      # `t.Skip("DB test skipped: postgres unavailable …")`,旧范围下"整包静默跳过"是绿的
      # (复审 F8)。本机实测(真库,`PG_DSN_TEST` 指向新建库):两包 `-json` 报告里
      # **用例级 skip = 0**(`internal/agentshare` 唯一的 `t.Skip` 是夹具尺寸超过预览上限
      # 时的分支,当前 10 个形态全部 ≤128KiB,不触发)⇒ 纳入判定面不会造成每次必红的假红。
      # 全仓报告里另有若干**环境条件型** skip(如 `internal/serverstore` 的 DST 用例在 UTC
      # runner 上必然 `t.Skip("本机时区无夏令时")`)—— 把"零用例级 skip"套到全仓等于每次
      # 必红的假红,而假红的常见下场是整条判据被关掉。范围外事件不参与判定(脚本打印计数)。
      - name: Go tests (repo-wide) + WASM case-level report
        run: |
          set -euo pipefail
          # 报告**不进 CI 日志**:上千个用例的 JSON 会把 job log 刷爆,而 GitHub 会截断
          # 中段(本仓踩过"失败用例名被自己人挤出日志")⇒ 重定向落盘,失败时另存 artifact。
          GO_TEST_STATUS=0
          go test ./... -count=1 -p 1 -timeout 15m -json > go-test.json || GO_TEST_STATUS=$?
          CHECK_STATUS=0
          node ../scripts/wasm/check-go-test-json.mjs go-test.json \
            --scope internal/wasmapp,internal/router,internal/marketplace,internal/agentshare \
            --require TestClientRequest_LoginRequiredWithoutIdentityIs401,TestCheckClientOrigin,TestClientFrameUser_ProjectsUserRowAndPublisherFlag \
            || CHECK_STATUS=$?
          if [ "${GO_TEST_STATUS}" -ne 0 ]; then
            echo "::error::go test 退出 ${GO_TEST_STATUS}(报告 go-test.json;上面的判定输出已列出失败/跳过的用例名)"
          fi
          # 两个退出码都要显式判定:`go test` 失败而判定脚本恰好判绿(例如报告被截断)
          # 时也不许放过 —— 反过来判定脚本的 1/2 同样是红。
          if [ "${GO_TEST_STATUS}" -ne 0 ] || [ "${CHECK_STATUS}" -ne 0 ]; then
            exit 1
          fi
      - name: Upload go test JSON report (on failure)
        # 失败时把报告带走:判定脚本只打印用例名,排障常要看完整事件流。
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json
          path: server/go-test.json
          if-no-files-found: ignore
      - run: npm test
        working-directory: server/webadmin
      - run: make build-server
      - name: Deployment asset syntax checks
        # 部署脚本(deploy.sh / install-server.sh)已于 2026-09-10 移除,此处只校验
        # 仍然发货的部署资产:镜像 entrypoint 的 shell 语法 + compose 配置。
        # defaults.run.working-directory 已是 server/,此处路径不用 server/ 前缀。
        run: |
          # errexit 不适用:本块要跑完三条互斥的资产检查再判定(见 BLOCK_ERREXIT_ALLOWLIST)。
          bash -n docker/entrypoint.sh
          if command -v docker >/dev/null 2>&1; then
            # 单 compose 文件(caddy+server+postgres):PG_PASSWORD 强必填,
            # 注入后验证语法
            PG_PASSWORD=ci docker compose -f docker-compose.yml config -q
            # 2026-09-02:PG18 挂载点运行验证需要启动 postgres 容器——CI 默认
            # 不依赖数据库,该检查改为 RUN_PG18_MOUNT_CHECK=1 时显式启用
            # (发布/部署验证流水线可设置)。compose 语法校验(上一步)仍始终执行。
            if [ "${RUN_PG18_MOUNT_CHECK:-0}" = "1" ]; then
              # 审计 2026-08-31:PG18 挂载点兼容验证——postgres:18-alpine 的 PGDATA
              # 是 /var/lib/postgresql/18/docker,compose 挂载 ./pg-data:/var/lib/postgresql
              # (父目录)。旧挂载点 /var/lib/postgresql/data 会被 entrypoint 判定为
              # "unused mount/volume" 而拒绝启动(exit 1),导致部署失败。
              # 2026-08-31 修复:临时目录改用 $RUNNER_TEMP(runner 保证可写且宿主可
              # 清理),不再依赖 /tmp;PG 容器以非 root(postgres uid 999)启动,而
              # mktemp -d 创建的目录是 0700 宿主权限——postgres 无法在挂载点内创建
              # 18/ 子目录,容器立即退出(No such container)。挂载点必须放开写权限。
              PG18_MOUNT="$(mktemp -d -p "${RUNNER_TEMP:-/tmp}")"
              chmod 0777 "$PG18_MOUNT"
              if ! PG18_CID="$(docker run -d --rm --name picoaide-ci-pg18 \
                -e POSTGRES_USER=picoaide -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=picoaide \
                -v "$PG18_MOUNT:/var/lib/postgresql" postgres:18-alpine)"; then
                echo "::error::docker run postgres:18-alpine 启动失败(详见上方 docker 输出)"
                rm -rf "$PG18_MOUNT"
                exit 1
              fi
              sleep 8
              if ! docker ps --format '{{.Names}}' | grep -qx picoaide-ci-pg18; then
                echo "::error::postgres:18-alpine 未能在挂载 /var/lib/postgresql 下启动(请检查 compose 挂载点)"
                docker logs "$PG18_CID" 2>&1 | tail -20 || true
                docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
                rm -rf "$PG18_MOUNT" 2>/dev/null || true
                exit 1
              fi
              docker rm -f "$PG18_CID" >/dev/null 2>&1 || true
              rm -rf "$PG18_MOUNT" 2>/dev/null || true
              echo "postgres:18-alpine mount-point check OK"
            else
              echo "PG18 挂载点运行验证跳过(RUN_PG18_MOUNT_CHECK=1 启用)"
            fi
          else
            # 审计 2026-08-25 A-01:docker 缺失时显式失败(此前静默跳过 =
            # compose 语法零验证)。
            echo "::error::docker 不可用,compose 语法校验被跳过"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    needs: [changes, gate]
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (linux)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      # Windows 默认 shell 是 pwsh,restore 用 POSIX bash 语法需显式 shell: bash。
      - name: Restore workspace build products
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # 构建产物来自 gate(同一次提交),此处不重复编译(--no-prebuild)。
      #
      # 渠道化(2026-09-10):逐个渠道打包,产物归集到 client-assets/<channel>/。
      # **渠道构建不输出日志**(用户定策)——官方构建跑同一套代码路径与打包脚本,
      # 排障看官方那一份;渠道 id 全程 ::add-mask::。列表由 ci-channels.sh 从
      # 私有渠道仓解析(正式 tag 发全部渠道 / beta tag 只发 beta / 非 tag 只发官方)。
      - name: Fetch channel packages (private repo)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          CHANNELS_REPO_TOKEN: ${{ secrets.CHANNELS_REPO_TOKEN }}
        run: bash scripts/ci-channels.sh
      # --official-last:官方最后构建,于是 dist/ 留下的是**官方**产物 ——
      # 紧随其后的 E2E 与人工排查都对着官方那一份(渠道产物已归集到 client-assets/)。
      - name: Package client installers for every selected channel
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          bash scripts/ci-package-clients.sh --official-last \
            --list channels.list --stage-dir client-assets \
            --patterns '*.AppImage' \
            --verify-app-dir dist/linux-unpacked \
            -- yarn workspace dsh-plugin-desktop dist:linux --no-prebuild
      # 注:Linux 只归集 AppImage(镜像与发布面都不要 deb)。dist:linux 仍会产出 deb,
      # 它作为本次运行的中间产物留在 runner 上,不进入任何交付面。
      # 品牌渠道的产物**不进公开 artifact**(artifact 对任何登录账号可取,而渠道
      # 目录名/文件名/包内品牌都是客户身份):改经 R2 临时前缀中转,release job 取回。
      # 官方/beta 不在中转范围内(它们的品牌本来就公开)。
      - name: Transfer brand-channel installers over R2 (not via public artifacts)
        if: ${{ !github.event.pull_request.head.repo.fork && startsWith(github.ref, 'refs/tags/v') }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws CLI 走标准 AWS_* 凭据(脚本只把 R2_* 用作端点/桶/HMAC 种子)。
          # 2026-09-11 v2.7.0 首次正式 tag 实测:漏了这两行 → 三个平台 job 全部
          # 在"Transfer brand-channel installers"步骤以 "Unable to locate
          # credentials" 失败,品牌渠道零交付(release job 因 needs 失败被跳过)。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-channel-transfer.sh push --list channels.list --stage client-assets
      # fork PR 拿不到 secret(渠道仓读不到)——回落到只构建官方,而不是让 PR 失败。
      - name: Package the official client only (fork PR without channel access)
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          yarn workspace dsh-plugin-desktop dist:linux --no-prebuild
          mkdir -p client-assets/official
          cp packages/host/desktop/dist/*.AppImage client-assets/official/
      # 客户端 E2E(2026-09-06 接入,G3 缺口):在打包产物上跑 13 项断言
      # (mock gateway + Xvfb + CDP),报告与截图随后上传。
      - name: Client E2E (packaged app, Xvfb)
        run: |
          set -euo pipefail
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          yarn workspace dsh-plugin-desktop e2e:client
          # 官方右侧栏的渲染 + 交互(2026-09-11 替换 better-sidebar 后新增):
          # e2e:client 的 mock 会话列表恒空、从不建会话,而右栏展开入口在会话
          # 作用域的会话头部 —— 只有这条 UI 路径能证明面板真的画出来。
          yarn workspace dsh-plugin-desktop e2e:sidebar
      # P2-51: 报告/截图复制必须独立成 step 且 if: always()——原先紧跟 e2e 命令
      # 同一 step 且在其后,`bash -e` 下 e2e 失败即跳过复制,导致 always() 的
      # upload-artifact 上传空目录(与决策文档「失败也留证据」矛盾)。
      - name: Collect E2E report & screenshots
        if: always()
        run: |
          # errexit 不适用:本块要逐个尝试收集三份证据再上传(见 BLOCK_ERREXIT_ALLOWLIST)。
          # upload-artifact v4+ 不收录点开头文件/目录(.e2e-report.md/.e2e-shots),
          # 复制并重命名为非点名称再上传(2026-09-06 两轮实测缺失)。
          mkdir -p packages/host/desktop/e2e-results
          cp packages/host/desktop/.e2e-report.md packages/host/desktop/e2e-results/e2e-report.md 2>/dev/null || true
          cp -r packages/host/desktop/.e2e-shots packages/host/desktop/e2e-results/shots 2>/dev/null || true
          cp -r packages/host/desktop/.e2e-sidebar/shots packages/host/desktop/e2e-results/sidebar-shots 2>/dev/null || true
      # artifact 名保持**中性**(不含渠道名):公开仓的 artifact 列表是匿名可读的
      # (实测),名字里带渠道 id 就等于公开客户名。
      # 2026-09-10 审计后**内容也不再含品牌渠道**:品牌渠道的安装包经 R2 私密中转
      # (见上面的 transfer 步骤),这里只剩 official/beta —— 它们的品牌本来就公开。
      #
      # 2026-09-12 审计 P1-1:上面那句"只剩 official/beta"**只在 tag 上成立** ——
      # transfer 步骤带 tag 守卫,分支/PR 上被跳过,品牌产物还留在 client-assets/。
      # 所以这里必须自己带同源守卫(与 macOS job 的写法一致,见本文件 desktop-macos),
      # 非 tag 时只上传 official;否则一个形如 `v9.9.9` 的**分支名**就能让客户品牌
      # 安装包进入匿名可读的 artifact。只改 `scripts/ci-channels.sh` 不足以兜住
      # "别的调用方往 client-assets/ 放东西",artifact 出口自己也要有门。
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-Linux
          path: client-assets/**
          if-no-files-found: error
      # 非 tag(PR/分支)也要有可下载产物:只传 official 那一份(品牌产物不在里面)。
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-Linux
          path: client-assets/official/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: packages/host/desktop/e2e-results/**
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop (Windows installer)
    needs: [changes, gate]
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (windows)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      # Windows 默认 shell 是 pwsh,restore 用 POSIX bash 语法需显式 shell: bash。
      - name: Restore workspace build products
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # 构建产物来自 gate,不重复编译(--no-prebuild);门禁在 gate 已跑,
      # 不再内嵌 check:win-package(--no-gates),但打包后 verify-win-installer
      # 仍在脚本内执行。
      #
      # 渠道化:逐个渠道打包(--official-last 让官方最后构建,便于排障),
      # 渠道构建不输出日志、渠道 id 全程掩码(见 scripts/ci-package-clients.sh)。
      - name: Fetch channel packages (private repo)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        shell: bash
        env:
          CHANNELS_REPO_TOKEN: ${{ secrets.CHANNELS_REPO_TOKEN }}
        run: bash scripts/ci-channels.sh
      - name: Package client installers for every selected channel
        if: ${{ !github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-package-clients.sh --official-last \
            --list channels.list --stage-dir client-assets \
            --patterns '*Setup*.exe' \
            --verify-app-dir dist/win-unpacked \
            -- yarn workspace dsh-plugin-desktop dist:win --no-prebuild --no-gates
      # 品牌渠道产物经 R2 中转,不进公开 artifact(与 linux job 同策)。
      # Windows 镜像不保证自带 aws CLI(ubuntu 有),缺了就装 —— 这条链失败
      # 等于品牌渠道零交付,不能让它悬在"环境碰巧有没有"上。
      - name: Ensure AWS CLI for the brand-channel transfer
        if: ${{ !github.event.pull_request.head.repo.fork && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: command -v aws >/dev/null 2>&1 || choco install awscli -y --no-progress
      - name: Transfer brand-channel installers over R2 (not via public artifacts)
        if: ${{ !github.event.pull_request.head.repo.fork && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws CLI 走标准 AWS_* 凭据(脚本只把 R2_* 用作端点/桶/HMAC 种子)。
          # 2026-09-11 v2.7.0 首次正式 tag 实测:漏了这两行 → 三个平台 job 全部
          # 在"Transfer brand-channel installers"步骤以 "Unable to locate
          # credentials" 失败,品牌渠道零交付(release job 因 needs 失败被跳过)。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-channel-transfer.sh push --list channels.list --stage client-assets
      # fork PR 拿不到 secret(渠道仓读不到)——回落到只构建官方,而不是让 PR 失败。
      - name: Package the official client only (fork PR without channel access)
        if: ${{ github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          set -euo pipefail
          yarn workspace dsh-plugin-desktop dist:win --no-prebuild --no-gates
          mkdir -p client-assets/official
          cp packages/host/desktop/dist/*Setup*.exe client-assets/official/
      # artifact 名中性(公开仓的 artifact 列表匿名可读,名字带渠道 id 即泄露客户名)。
      # 守卫与 linux job / macOS job 同源(2026-09-12 审计 P1-1):品牌渠道产物经
      # R2 中转、**只在 tag 上**被搬走,非 tag 时 client-assets/ 里仍有品牌目录
      # ⇒ 无守卫的 upload 等于把客户品牌安装包公开。非 tag 只传 official。
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-Windows-installer
          path: client-assets/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-Windows-installer
          path: client-assets/official/**
          if-no-files-found: error

  # macOS 单 job 三态:正式 tag(纯 vX.Y.Z)打包+签名+公证(可重试);预发 tag
  # (vX.Y.Z-*,如 beta/rc)只签名不公证——Releases 页面可见、真机可装(首次
  # 右键打开),免去每次 1-5 小时公证排队;其他(PR/分支)只做未签名冒烟。
  # 渠道包跟随同一判据(2026-09-11):正式 tag 的渠道 DMG 也签名+公证+staple,
  # 预发 tag 的 beta 渠道维持只签名。
  # 合并而非互斥 job:Release job 的 needs 需要稳定的 mac 依赖(两颗互斥 job
  # 会让 Release 因 needs 里某颗被 skip 而连带 skip,2026-09-05 beta.1 实测)。
  desktop-macos:
    name: Desktop (macOS)
    needs: [changes, gate]
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: macos-15
    # 330 → 360(GitHub 托管 runner 上限):正式 tag 上官方与每个渠道各自排队公证,
    # 共享同一份 job 预算(渠道数一多就要改成按序号矩阵拆 job,见 release runbook)。
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Cache yarn & electron (macos)
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: desktop-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - uses: actions/download-artifact@v7
        with:
          name: workspace-build
          path: package-input
      - name: Restore workspace build products
        run: |
          set -euo pipefail
          tar -xzf package-input/workspace-build.tgz
          [ -d packages/host/desktop/lib ] || { echo "::error::workspace-build 解压后缺少 desktop lib"; exit 1; }
          [ -d packages/host/desktop/build ] || { echo "::error::workspace-build 解压后缺少 desktop build 产物"; exit 1; }
      # App Store Connect API Key:secret 里存的是 .p8 文件内容,写入临时文件
      # 以路径形式传给 electron-builder(正式分支专用;冒烟分支不ary用)。
      - name: Materialize App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # 构建产物来自 gate,不重复编译;门禁与根 check 在 gate 已跑
      # (--no-prebuild --no-gates)。
      # ==== 正式分支:打包(含完整 gate)+签名,公证在下一步(可续等) ====
      - name: Pack and sign app bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # preflight 校验整体发布凭据完整性(含公证三元组),pack 不公证但需通过
          # 校验——不传会在"Pack"步骤提前 fail(2026-09-05 rc.3 实测)。
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Notarize and build DMG (resumable)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "attempt ${attempt}/3: yarn dist:mac:notarize"
            if yarn workspace dsh-plugin-desktop dist:mac:notarize --no-prebuild; then
              echo "notarized DMG built on attempt ${attempt}"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt ${attempt} failed; retrying in 60s (same submission resumed)"
              sleep 60
            fi
          done
          exit 1
        env:
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # ==== 预发 tag(vX.Y.Z-beta.N / -rc.N):签名不公证(preflight 免公证元组) ====
      - name: Pack and sign app bundle (prerelease, sign-only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates --sign-only
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      - name: Build signed DMG without notarization (prerelease)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
        run: yarn workspace dsh-plugin-desktop dist:mac:dmg --no-prebuild
      # ==== 非正式分支(PR/分支):未签名冒烟,不进签名公证 ====
      - name: Build unsigned smoke DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke --no-prebuild --no-gates
      # ==== 渠道化(tag 时):官方已由上面三步构建完毕,这里只做品牌渠道 ====
      #
      # 正式 tag 上渠道与官方走**同一条签名+公证+staple 链**(2026-09-11 修复)。
      # 此前渠道只做 --sign-only(借预发 tag 那条路径),交付到客户 Mac 上首次打开
      # 被 Gatekeeper 拦成「Apple 无法验证 / 未能验证开发者」——渠道包是**交付物**,
      # 不能要求客户去"右键打开/系统设置里放行"。实测证据(2026-09-11,2.7.0 渠道包):
      # 已公证的官方 DMG 里 app 带 staple 票据(Contents/CodeResources,s8ch 头 +
      # Apple Software Ticket Signing 链),而 sign-only 的渠道 DMG 里没有。
      #
      # 预发 tag(名字含 '-')的渠道列表只有 beta。beta 渠道包**仍然公证**
      # (2026-09-13 定案):它也是要装到别人 Mac 上的交付物,内测同学没有理由
      # 去"右键打开/系统设置里放行";代价可控 —— 预发只构建 beta 一个渠道,最多
      # 多排一次队,而官方预发那条路径仍只签名,不把公证排队压在每次内测上。
      # 正式 tag 上全部渠道与官方走同一条签名+公证+staple 链(2026-09-11 修复)。
      #
      # 渠道构建**不输出日志**(用户定策),渠道 id 全程 ::add-mask::;排障看官方
      # 那一份 —— 渠道与官方跑同一套打包脚本,只换 DSH_BUILD_CHANNEL。
      - name: Fetch channel packages (private repo)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          CHANNELS_REPO_TOKEN: ${{ secrets.CHANNELS_REPO_TOKEN }}
        run: bash scripts/ci-channels.sh
      - name: Stage the official DMG for the release image
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          mkdir -p client-assets/official
          cp packages/host/desktop/dist/mac-release/*.dmg client-assets/official/
          ls -1 client-assets/official/
      - name: Package brand-channel DMGs (quiet, signed + notarized)
        # 预发 tag 上也跑:此时渠道列表只有 beta,而 beta 的 mac 包同样要公证
        # (见上方注释)。官方预发的只签名分支在上面,与这里无关。
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # 公证三元组:渠道包一律公证(见上方注释),所以预发 tag 也要带上;
          # 走 --sign-only 分支的时代已经不在了,preflight 不再允许 absence。
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # 渠道包一律签名+公证+staple(正式 tag 全渠道、预发 tag 的 beta)。
          # 唯一真源:渠道包是交付物,不含"只签名"的例外。
          CHANNEL_NOTARIZE: 'true'
        run: |
          # 显式声明**外层**脚本的退出语义;传给 `bash -c` 的内层脚本自带一份(两者互不覆盖:
          # 内层那句约束的是内层,见 scripts/check-workflows.mjs 的 hasErrexitGuard 注释)。
          set -eo pipefail
          bash scripts/ci-package-clients.sh --skip-official \
            --dist packages/host/desktop/dist/mac-release \
            --list channels.list --stage-dir client-assets --patterns '*.dmg' \
            -- bash -c '
              set -euo pipefail
              if [ "${CHANNEL_NOTARIZE}" = "true" ]; then
                yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates
                # 公证可重试:submission id 由 release-mac.ts 持久化在
                # dist/mac-release/.notary-submission.json(下次 pack 才清),
                # 重试续等同一提交,不重复排队(与官方那条 3 次重试同语义)。
                for attempt in 1 2 3; do
                  echo "channel notarize attempt ${attempt}/3"
                  if yarn workspace dsh-plugin-desktop dist:mac:notarize --no-prebuild; then
                    exit 0
                  fi
                  if [ "${attempt}" -lt 3 ]; then sleep 60; fi
                done
                exit 1
              fi
              yarn workspace dsh-plugin-desktop dist:mac:pack --no-prebuild --no-gates --sign-only
              yarn workspace dsh-plugin-desktop dist:mac:dmg --no-prebuild
            '
      - name: Transfer brand-channel DMGs over R2 (not via public artifacts)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws CLI 走标准 AWS_* 凭据(脚本只把 R2_* 用作端点/桶/HMAC 种子)。
          # 2026-09-11 v2.7.0 首次正式 tag 实测:漏了这两行 → 三个平台 job 全部
          # 在"Transfer brand-channel installers"步骤以 "Unable to locate
          # credentials" 失败,品牌渠道零交付(release job 因 needs 失败被跳过)。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-channel-transfer.sh push --list channels.list --stage client-assets
      # artifact 名中性;品牌渠道产物已由上面的中转步骤移出 client-assets(tag 时)。
      - uses: actions/upload-artifact@v7
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-macOS
          path: client-assets/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  # 发布(2026-09-10 改版):GitHub Release **仍然发布**,但内容物从"客户端安装包"
  # 改为"服务端镜像压缩包"。两条分发面分工见
  # docs/planning/2026-09-10-r2-update-server-runbook.md §0.1:
  #   - 更新服务器(R2 release.picoaide.com):热分发面,只留最近 3 个版本,服务端
  #     updatecheck 与客户部署从这里取;
  #   - GitHub Release(本 job):冷存档 + 变更记录,永久保留全部历史版本镜像,
  #     审计/查变更/取更老版本镜像时用。
  # 客户端安装包不再单独发布:它已经在镜像里,由服务端自行下发。
  release:
    name: Release (server image archive)
    # 只对 beta 与 official 发布到 GitHub Release(2026-09-10 定案):
    # 品牌渠道是客户定制交付,不进公开 Releases(客户从更新服务器自己的渠道目录取)。
    #
    # **这里只判"是不是 v 开头的 tag",不再判 tag 形态**(2026-09-23 审计 K-04):
    # 形态 → 渠道集/是否发布的映射是 `scripts/ci-release-policy.sh` 一份实现,由
    # gate 的第一步执行(未知形态当场红 ⇒ 本 job 因 `needs` 被跳过)。
    # 曾经这里写着第二份判据 `… || !contains(github.ref_name, '-')`,它与渠道脚本
    # 对 `v2.8.2-hotfix` 结论相反:全渠道构建 + 零发布(客户侧零信号、R2 中转前缀
    # 无人清理)。**不要**再把名字形状判断写回这个 `if:`。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # 2026-09-23 审计 C-CI-2:策展发布说明的**第二道**检查必须在任何对外上传之前。
      #
      # 此前唯一会拦它的地方在 "Create GitHub Release" 步骤里,而那一排在
      # "Upload every channel image to the update server (R2)" **之后** ⇒ 正式 tag 缺
      # docs/releases/<tag>.md 时,客户侧更新面(latest.json + 镜像对象,且该路径是
      # 不可变长缓存)已经先被挂上新版本,才轮到 GitHub Release 步骤红 —— 结果是
      # "半发布":客户端能升到一个没有策展说明、也没有 GitHub Release 的版本。
      # gate 里的早检仍在(1 分钟内报错、下游全部因 needs 跳过);这里是 release job
      # 的第一步 —— 只要它没过去,后面一个上传步骤都不会跑。
      # 形态判定仍走唯一真源 `scripts/ci-release-policy.sh`(未知形态它也当场红)。
      - name: Require curated release notes before any upload
        run: |
          set -euo pipefail
          bash scripts/ci-release-policy.sh > release-policy.txt
          cat release-policy.txt
          if grep -qx 'release_kind=stable' release-policy.txt; then
            test -f "docs/releases/${GITHUB_REF_NAME}.md" || {
              echo "::error::正式版缺少策展发布说明 docs/releases/${GITHUB_REF_NAME}.md(模板见 docs/releases/TEMPLATE.md);在任何对外上传之前中止"
              exit 1
            }
            echo "OK: docs/releases/${GITHUB_REF_NAME}.md"
          else
            echo "非正式版 ⇒ 允许缺策展说明(公开面仍优先用策展说明)"
          fi
      # 三平台安装包仍需先构建:它们要打进镜像(客户端随镜像分发)。
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      # 审计 2026-08-25 复查【7】:release job 需要显式 node(ubuntu 镜像自带
      # 版本非保证),tag 校验的 node -p 才有确定性环境。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 发布前强制校验 tag == 两处 package.json version(scripts/version.mjs 是
      # 唯一真源;版本号只改一处会让发布成功但升级源永久对不上)。不一致 fail-loud。
      - name: Verify tag matches package versions
        run: |
          set -euo pipefail
          node scripts/version.mjs check "$GITHUB_REF_NAME"

      # 渠道发现 + 逐渠道构建(2026-09-10 定案):
      #   正式 tag vX.Y.Z → 发**全部**渠道;beta tag → 只发 beta;非 tag → 只发官方。
      #   品牌渠道**只进 R2**,绝不进公开 GitHub Release(见下面的 Release 步骤)。
      #
      # **渠道构建不输出日志**(用户定策):只有 official 保留完整构建输出,渠道 id
      # 全程 ::add-mask::。渠道与官方共用同一套 Dockerfile / 打包脚本,只换
      # --build-arg CHANNEL,排障看官方那一份。
      - name: Fetch channel packages (private repo)
        env:
          CHANNELS_REPO_TOKEN: ${{ secrets.CHANNELS_REPO_TOKEN }}
        run: bash scripts/ci-channels.sh

      # 品牌渠道的客户端产物走 R2 中转(见 desktop-linux job 的说明),这里取回。
      # 前缀由 run id + HMAC(R2 密钥)派生,渠道名从不出现在任何键或日志里。
      - name: Fetch brand-channel installers from the R2 transfer prefix
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws CLI 走标准 AWS_* 凭据(脚本只把 R2_* 用作端点/桶/HMAC 种子)。
          # 2026-09-11 v2.7.0 首次正式 tag 实测:漏了这两行 → 三个平台 job 全部
          # 在"Transfer brand-channel installers"步骤以 "Unable to locate
          # credentials" 失败,品牌渠道零交付(release job 因 needs 失败被跳过)。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-channel-transfer.sh pull --list channels.list --to release-artifacts

      - name: Build one server image per channel
        id: images
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci-build-channel-images.sh \
            --list channels.list --artifacts release-artifacts --out release-bundle

      # 更新服务器(R2)上传:每个渠道写自己的目录 `release.picoaide.com/<channel>/`,
      # 品牌渠道也走这里 —— R2 是它们的**唯一**分发面。R2 secrets 未配置时跳过而非
      # 失败,保证 GitHub Release 本身可用(上传细节与保留策略见
      # docs/planning/2026-09-10-r2-update-server-runbook.md §5)。
      #
      # 逻辑在脚本里(scripts/ci-publish-update-server.sh)并带本地回归门禁:
      # 布局/清单/保留策略/缓存头出错都是静默的,只能发版时才发现,所以它必须
      # 能在本地用假的 aws 断言(scripts/verify-ci-scripts.mjs)。
      - name: Upload every channel image to the update server (R2)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ github.ref_name }}
        run: bash scripts/ci-publish-update-server.sh --list channels.list

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="picoaide/picoaide-harness"
          # 说明(**公开发布面**,2026-09-11 定案):正式 tag 必须有策展发布说明
          # (docs/releases/<tag>.md,模板 TEMPLATE.md);缺失即失败,绝不静默回退
          # 自动生成的 PR 列表 —— 版本页是给客户与运维看的,不是 CI 日志。
          # 预发 tag 允许缺失(beta/rc 面向内测),回退自动变更日志并告警。
          NOTES="docs/releases/${TAG}.md"
          if [ -f "${NOTES}" ]; then
            echo "Using curated release notes from ${NOTES}"
            NOTES_FLAG="--notes-file ${NOTES}"
          elif [[ "${TAG}" == *-* ]]; then
            echo "::warning::${NOTES} not found — prerelease falls back to GitHub auto-generated notes"
            NOTES_FLAG="--generate-notes"
          else
            echo "::error::正式版 ${TAG} 缺少发布说明 ${NOTES}(模板见 docs/releases/TEMPLATE.md)"
            exit 1
          fi
          # prerelease tag(含 prerelease 段)按 GitHub 语义以 Pre-release 发布:
          # 可见但不会被当成 Latest。正式 tag 发布为普通 release。
          PRERELEASE=""
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE="--prerelease"
            echo "Releasing ${TAG} as a prerelease"
          fi
          # 幂等(2026-09-06):同 tag 重跑时 release 已存在会 422 —— 先查再决定
          # create/edit,并用 --clobber 覆盖旧资产(旧资产是上次运行的产物)。
          # **只发公开渠道**(官方/beta)那一张 zip:品牌渠道是客户定制交付,
          # 只进 R2 自己的目录,绝不进公开 Release(2026-09-10 定案)。
          PUBLIC="${{ steps.images.outputs.public_channel }}"
          test -n "${PUBLIC}" || { echo "::error::未解析出公开渠道"; exit 1; }
          test -f "release-bundle/${PUBLIC}/picoaide-server-${TAG#v}-amd64.zip" \
            || { echo "::error::公开渠道的镜像包不存在,拒绝发布空 Release"; exit 1; }
          # Release 名 = tag 本身,不加产品名前缀(2026-09-11 定案):Releases 页左侧
          # 列表宽度固定,"PicoAide Harness v2.6.9-beta.5" 会被截断成
          # "PicoAide Harness v2.6…" —— 一页十几个版本号全都看不见,只剩重复前缀。
          # 产品名由仓库与页面标题承载,Release 名只回答"是哪个版本"。
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating title/notes/flags and clobbering assets"
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "${TAG}" ${NOTES_FLAG} ${PRERELEASE}
            gh release upload "${TAG}" --repo "${REPO}" --clobber \
              "release-bundle/${PUBLIC}/"*.zip "release-bundle/${PUBLIC}/SHA256SUMS"
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --title "${TAG}" ${NOTES_FLAG} ${PRERELEASE} \
              "release-bundle/${PUBLIC}/"*.zip "release-bundle/${PUBLIC}/SHA256SUMS"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 取回即销毁:中转对象只应存在几分钟(R2 桶是公开读的,虽然前缀不可猜,
      # 也没有理由让客户产物在公网多停留)。失败也执行,避免残留。
      - name: Destroy the R2 transfer prefix
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws CLI 走标准 AWS_* 凭据(脚本只把 R2_* 用作端点/桶/HMAC 种子)。
          # 2026-09-11 v2.7.0 首次正式 tag 实测:漏了这两行 → 三个平台 job 全部
          # 在"Transfer brand-channel installers"步骤以 "Unable to locate
          # credentials" 失败,品牌渠道零交付(release job 因 needs 失败被跳过)。
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/ci-channel-transfer.sh clean --list channels.list

  # PR 场景:把本次提交的编译产物汇总评论到 PR(fork 分支 token 只读,跳过)。
  pr-summary:
    name: PR build artifacts summary
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs: [changes, desktop-linux, desktop-windows, desktop-macos, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- picoaide-ci-artifacts -->'
            const docsOnly = '${{ needs.changes.outputs.code }}' === 'false'
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = docsOnly
              ? [
                  marker,
                  '## 本次只改文档',
                  '',
                  '改动只涉及 `docs/`、`site/` 或 `*.md`，按 CI 规则（`changes` job）跳过了 Gate / Go server / 三平台打包；合并不受影响。',
                  '',
                  `规则见 \`.github/workflows/ci.yml\` 的 \`changes\` job；出现任何非文档文件即回到全量 CI。`,
                ].join('\n')
              : [
                  marker,
                  '## CI 编译产物',
              '',
              '本次提交的门禁（gate + server + 三平台打包）全部通过，可下载产物：',
              '',
              `- Desktop (Linux): \`desktop-Linux\` — AppImage（含 \`e2e-report\` 客户端 E2E 结果）`,
              `- Desktop (Windows): \`desktop-Windows-installer\` — NSIS Setup`,
              `- Desktop (macOS): \`desktop-macOS\` — DMG`,
              `- Server: \`picoaide-server-linux-amd64\` — Go 服务端二进制`,
              '',
              `下载入口：[Actions 运行页 → Artifacts](${runUrl}#artifacts)`,
                ].join('\n')
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            for (const comment of comments.data) {
              if (comment.body && comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                })
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
