name: CI

on:
  pull_request:
  push:

# 审计 2026-08-25 D-3:顶层权限收窄为 contents: read(actions: write 对纯 CI
# 仓库非最小)。release job 在自身声明 contents: write。
permissions:
  contents: read

# 审计 2026-08-25 D-2:同 ref 并发触发(重推 tag/两 tag)互斥,release 不再
# 并行争抢同一版本。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make build-server
      - name: Deploy script syntax checks
        # defaults.run.working-directory 已是 server/,此处路径不用 server/ 前缀,
        # 否则实际变为 server/server/scripts/...(文件不存在, exit 127)。
        run: |
          bash -n scripts/install-server.sh scripts/deploy.sh
          if command -v docker >/dev/null 2>&1; then
            PG_PASSWORD=ci PG_DSN=postgres://picoaide:ci@postgres:5432/picoaide \
              docker compose -f docker-compose.yml -f docker-compose.pg.yml config -q
            PG_DSN=postgres://picoaide:ci@pg.example.com:5432/picoaide \
              docker compose -f docker-compose.yml -f docker-compose.pg-ext.yml config -q
          else
            # 审计 2026-08-25 A-01:docker 缺失时显式失败(此前静默跳过 =
            # compose 语法零验证)。
            echo "::error::docker 不可用,compose 语法校验被跳过"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn workspace dsh-plugin-desktop dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Linux
          path: |
            packages/host/desktop/dist/*.AppImage
            packages/host/desktop/dist/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Windows-installer
          path: packages/host/desktop/dist/*Setup*.exe
          if-no-files-found: error

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      # 审计 2026-08-25 复查【7】:release job 需要显式 node(ubuntu 镜像自带
      # 版本非保证),tag 校验的 node -p 才有确定性环境。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 审计 2026-08-25 D-2:发布前强制校验 tag == 两处 package.json version
      # (update-checker 剥 v 后匹配资产名;版本号只改一处 = 发布成功但用户
      # 升级源永久失效)。不一致直接 fail-loud。
      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DESKTOP_VERSION="$(node -p "require('./packages/host/desktop/package.json').version")"
          echo "tag=$TAG_VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION"
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ] || [ "$TAG_VERSION" != "$DESKTOP_VERSION" ]; then
            echo "::error::版本号不一致: tag=$TAG_VERSION root=$ROOT_VERSION desktop=$DESKTOP_VERSION"
            exit 1
          fi
      - name: Compute SHA-256 digests
        run: |
          cd release-artifacts
          # 审计 D-4:显式清单防 glob 吞入残留产物;空目录时 xargs 报错,先保护。
          if ! find . -maxdepth 1 \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) | grep -q .; then
            echo "::error::no release artifacts found";
            exit 1
          fi
          find . -maxdepth 1 \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo picoaide/picoaide-harness \
            --title "PicoAide Harness ${GITHUB_REF_NAME}" \
            --notes "DSH Desktop release ${GITHUB_REF_NAME}" \
            release-artifacts/*.AppImage release-artifacts/*.exe release-artifacts/*.dmg release-artifacts/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
