name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make build-server
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn workspace dsh-plugin-desktop dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Linux
          path: |
            packages/host/desktop/dist/*.AppImage
            packages/host/desktop/dist/*.deb
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-Windows-installer
          path: packages/host/desktop/dist/*Setup*.exe
          if-no-files-found: error

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macOS
          path: packages/host/desktop/dist/mac-smoke/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Compute SHA-256 digests
        run: |
          cd release-artifacts
          sha256sum *.AppImage *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo picoaide/picoaide-harness \
            --title "PicoAide Harness ${GITHUB_REF_NAME}" \
            --notes "DSH Desktop release ${GITHUB_REF_NAME}" \
            release-artifacts/*.AppImage release-artifacts/*.exe release-artifacts/*.dmg release-artifacts/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
