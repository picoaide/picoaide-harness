name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/webadmin/package-lock.json
      - run: npm ci
        working-directory: server/webadmin
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: make build-server
      - uses: actions/upload-artifact@v7
        with:
          name: picoaide-server-linux-amd64
          path: server/bin/picoaide-server
          if-no-files-found: error

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn workspace dsh-plugin-desktop package:dir
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-unpacked
          path: dsh-plugin-desktop/dist/linux-unpacked/
          if-no-files-found: error
