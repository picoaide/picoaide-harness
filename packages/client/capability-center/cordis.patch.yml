# 能力中心（技能商店）的宿主行。
#
# 这一行承载客户端 bundle（`dsh.client`）：面板本身（中列整页）与底部「更多」条目
# 都在客户端半边，经 `picoFootMenu` 服务登记。宿主半边是 no-op —— 本包不拥有任何
# 本机路由或数据面：它调用的 `/api/client/v2/skills*` 与 `/api/pico/skills/*` 全部由
# `@picoaide/dsh-enterprise` 的 auth-gate 注册。
#
# 两个包刻意保持独立：把本包从 profile 的 bundle 层里去掉，能力中心的界面与入口一起
# 消失，而宿主代理（供其它消费者使用）不受影响。
- insert:
    - id: picoaide-capability-center
      name: '@picoaide/dsh-capability-center'
