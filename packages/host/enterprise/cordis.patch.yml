# Enterprise Host rows: the bare entry carries the package's client bundle
# declaration (skill center + account surfaces), the session service provides
# `picoSession`, then the gateway-model and bootstrap listeners react to its
# changes, and the auth-gate owns the login gate and skill-store proxy.
- insert:
    - id: picoaide-enterprise
      name: '@picoaide/dsh-enterprise'
    - id: picoaide-session
      name: '@picoaide/dsh-enterprise/session-service'
    - id: picoaide-gateway-model
      name: '@picoaide/dsh-enterprise/gateway-model'
    - id: picoaide-bootstrap
      name: '@picoaide/dsh-enterprise/bootstrap'
    - id: picoaide-error-reporting
      name: '@picoaide/dsh-enterprise/error-reporting'
    - id: picoaide-skill-telemetry
      name: '@picoaide/dsh-enterprise/skill-telemetry'
    - id: picoaide-auth-gate
      name: '@picoaide/dsh-enterprise/auth-gate'
    - id: picoaide-channel-sync
      name: '@picoaide/dsh-enterprise/channel-sync'
# Enterprise model governance: models come from the gateway after login only.
# The upstream models settings page lets users define custom providers, so it
# is disabled from the composition. bootstrap.ts keeps the gateway catalog in
# llm-deepseek and clears it on logout.
- id: ui-settings-models
  disabled: true
# web_search 服务端代理(0043):官方 key 不得以任何形式出现在客户端直连配置中。
# 覆盖 base bundle 的 apiKeyEnv=DEEPSEEK_API_KEY——即使登出后 bootstrap 将
# user 层清空,composition 兜底也不再指向官方 key,而是指向网关 token。
# 会话建立后 bootstrap.ts 再写入具体 serverURL/baseURL/model。登出态下
# baseURL 回落官方端点,但 PICOAI_GATEWAY_TOKEN 已被 gateway-model unset,
# 搜索在凭据解析处失败(未见官方端点即缺 key),不会构成直连泄露。
- id: web-search-deepseek
  config:
    apiKeyEnv: PICOAI_GATEWAY_TOKEN
# 网关鉴权协议:上游 0.1.6 起 `llm-deepseek` 新增 `protocol`,**缺省值是
# `messages`**;该协议路径只发 `x-api-key`、**不发 `Authorization`**
# (`protocols/messages/adapter.ts`),而我们的网关 `/v1/*` 挂在 serverauth 的
# `BearerAuth` 下、只认 `Authorization: Bearer …` ⇒ 每个模型请求都是
# 401 `AUTH_REQUIRED`「缺少认证令牌」,整条模型链路报废。网关只实现 Bearer
# 这一种鉴权,所以这里**组装期**钉死 chat-completions。
# 为什么不能只靠 `gateway-model` 运行期往 settings 里写:那条写入依赖
# settings 落盘成功,而落盘会被任何一次写锁异常永久挡住(见下面的孤儿锁回收),
# 于是"本该修好链路的这一行"恰恰写不进去 —— 现场事故(2026-09-22)的完整链条。
# 组装层是 base,缺这个键的 user 层不会覆盖它。要改协议:未登录时可由 settings 覆盖;
# 一旦有会话,`gateway-model` 的 sync 会把 user 层的 protocol 写回 chat-completions
# (user 层压 base),所以"改协议"只在未登录/离线场景持久。
# 注意 `config` 是**整键替换**:更晚的层(`$DSH_HOME/cordis.patch.yml`)若覆盖本行
# config,**必须重述 `protocol: chat-completions`** —— 只写别的键(如 models)会把这条
# pin 一起换掉、静默回落 `messages`(判据 tests/llm-gateway-protocol-pin.spec.ts)。
- id: llm-deepseek
  config:
    protocol: chat-completions
# Local skill discovery: the web-app bundle disables the host skill
# provider rows (presets own local discovery), but the desktop has no
# presets. Mount the filesystem provider (scans `<dshHome>/skills`, which
# the skill center installs into) and the model-facing catalog/loader so
# installed skills are visible to the agent. The `skill` registry row is
# already live in the web-app bundle. Fresh ids avoid colliding with the
# disabled placeholder rows in the web-app bundle.
- insert:
    - id: pico-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
    - id: pico-tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
# Enterprise brand: product name and window title for the native shell (the
# desktop Config schema defaults stay upstream-compatible).
- id: desktop-shell
  config:
    mode: compatibility
    productName: 'PicoAide Harness'
    windowTitle: 'PicoAide Harness'
