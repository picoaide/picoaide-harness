# Desktop Host operations compose around the existing Web bundle. The shell
# presentation is fixed to the platform-native advanced mode.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: advanced
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: desktop-loop-notify
      name: dsh-plugin-desktop/loop-notify
    - id: desktop-asar-fs
      name: dsh-plugin-desktop/asar-file-system
    - id: desktop-asar-guidance
      name: dsh-plugin-desktop/asar-guidance

# The desktop filesystem backend replaces upstream `fs-sandbox`: it inherits
# the sandbox fence and adds asar-link unwinding for packaged in-box reads.
- id: fs-sandbox
  disabled: true

# 桌面隐藏「插件」设置选项卡(2026-09 产品决策): 上游 web-app bundle 挂载的
# ui-settings-plugins 行按用户配置展开可配置卡片,桌面端无此诉求,与模型
# 选项卡的治理方式一致(见 enterprise/cordis.patch.yml 的 ui-settings-models)。
# better-sidebar 的「侧边卡片」选项卡保留(无独立挂载行,为 vendored 客户端
# 注册面,不在此处禁用)。
- id: ui-settings-plugins
  disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Web 工具:web_search 走网关 /v1/messages 服务端代理;web_fetch 由 base
# bundle 默认挂载(0.1.2 起内置 SSRF 防护,公网默认放行——不再重复 insert
# web-fetch-http,避免与 base 的声明重复)。preset(agent)层的 tool-web 只
# 注册 web_search,web_fetch 由全局层注册,对所有会话可见。
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http
- id: tool-web
  disabled: false
  config:
    fetch: true
    searchTimeoutMs: 60000
